<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>旅費メモ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
  :root{
    --ink:#1E3A34;
    --ink-soft:#3E5A53;
    --paper:#F1EEE4;
    --card:#FFFFFF;
    --line:#DAD5C4;
    --accent:#B5502F;
    --accent-soft:#F1DDD3;
    --gold:#C7962C;
    --gold-soft:#F3E7C6;
    --good:#3E7A5C;
    --good-soft:#DCEBE0;
    --danger:#B5502F;
    --radius-card: 4px;
    --radius-pill: 999px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Zen Kaku Gothic New', system-ui, -apple-system, sans-serif;
    font-size:15px;
    line-height:1.6;
    min-height:100vh;
  }
  h1,h2,h3,h4{
    font-family:'Zen Old Mincho', serif;
    font-weight:700;
    margin:0 0 4px 0;
    color:var(--ink);
  }
  button{
    font-family:inherit;
    cursor:pointer;
  }
  input, select, textarea{
    font-family:inherit;
    font-size:14px;
  }
  #app{
    max-width:960px;
    margin:0 auto;
    min-height:100vh;
    background:var(--paper);
    display:flex;
    flex-direction:column;
  }

  /* ---------- Top bar ---------- */
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:18px 22px;
    border-bottom:2px solid var(--ink);
  }
  .brand{
    display:flex;
    align-items:baseline;
    gap:10px;
  }
  .brand .stamp{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:34px;height:34px;
    border:2px solid var(--accent);
    border-radius:50%;
    color:var(--accent);
    font-family:'Zen Old Mincho',serif;
    font-weight:700;
    font-size:16px;
    transform:rotate(-8deg);
  }
  .brand h1{font-size:22px; letter-spacing:.02em;}
  .topbar .who{
    font-size:13px;
    color:var(--ink-soft);
    text-align:right;
  }
  .topbar .who button{
    background:none;border:none;color:var(--accent);
    font-size:12px; padding:0; text-decoration:underline;
  }

  main{flex:1; padding:22px; padding-bottom:60px;}

  /* ---------- Cards / generic ---------- */
  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius-card);
    padding:20px;
    margin-bottom:16px;
  }
  .card + .card{margin-top:16px;}
  .section-title{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:14px;
  }
  .section-title h2{font-size:19px;}
  .muted{color:var(--ink-soft); font-size:13px;}

  .field{margin-bottom:14px;}
  .field label{
    display:block;
    font-size:12.5px;
    color:var(--ink-soft);
    margin-bottom:5px;
    font-weight:500;
  }
  .field input[type=text],
  .field input[type=number],
  .field input[type=date],
  .field input[type=email],
  .field input[type=password],
  .field select,
  .field textarea{
    width:100%;
    padding:9px 10px;
    border:1px solid var(--line);
    border-radius:3px;
    background:#FCFBF8;
    color:var(--ink);
  }
  .field textarea{resize:vertical; min-height:56px;}
  .field input:focus, .field select:focus, .field textarea:focus{
    outline:2px solid var(--accent);
    outline-offset:1px;
    background:#fff;
  }
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:0 16px;}
  .grid3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:0 16px;}
  @media (max-width:600px){ .grid2,.grid3{grid-template-columns:1fr;} }

  .toggle-row{
    display:flex; align-items:center; justify-content:space-between;
    padding:10px 0; border-bottom:1px solid var(--line);
  }
  .toggle-row:last-child{border-bottom:none;}
  .toggle-row .label{font-size:14px;}
  .toggle-row .desc{font-size:12px; color:var(--ink-soft); margin-top:2px;}
  .switch{
    position:relative; width:42px; height:24px; flex-shrink:0;
  }
  .switch input{opacity:0; width:100%; height:100%; margin:0; position:absolute; cursor:pointer; z-index:1;}
  .switch .track{
    position:absolute; inset:0; background:#D9D4C4; border-radius:var(--radius-pill); transition:.15s;
  }
  .switch .thumb{
    position:absolute; top:3px; left:3px; width:18px; height:18px; background:#fff;
    border-radius:50%; transition:.15s; box-shadow:0 1px 2px rgba(0,0,0,.25);
  }
  .switch input:checked + .track{background:var(--good);}
  .switch input:checked + .track + .thumb{left:21px;}

  /* buttons */
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    padding:10px 18px;
    border-radius:3px;
    border:1px solid var(--ink);
    background:var(--ink);
    color:#fff;
    font-size:14px;
    font-weight:500;
    letter-spacing:.02em;
  }
  .btn:hover{opacity:.9;}
  .btn.secondary{
    background:transparent; color:var(--ink); border:1px solid var(--line);
  }
  .btn.accent{background:var(--accent); border-color:var(--accent);}
  .btn.ghost{
    background:transparent; border:none; color:var(--ink-soft);
    text-decoration:underline; padding:6px 4px;
  }
  .btn.danger{background:transparent; color:var(--accent); border:1px solid var(--accent-soft);}
  .btn.sm{padding:6px 12px; font-size:13px;}
  .btn:disabled{opacity:.45; cursor:not-allowed;}
  .btn-row{display:flex; gap:10px; margin-top:16px; flex-wrap:wrap;}

  /* ---------- Trip list ---------- */
  .trip-list-header{
    display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;
  }
  .trip-card{
    display:flex; justify-content:space-between; align-items:center;
    padding:16px 18px;
    border:1px solid var(--line);
    border-left:4px solid var(--accent);
    background:var(--card);
    border-radius:3px;
    margin-bottom:10px;
    cursor:pointer;
  }
  .trip-card:hover{background:#FAF7EF;}
  .trip-card .route{font-size:13px; color:var(--ink-soft); margin-top:4px;}
  .trip-card .dates{font-size:12.5px; color:var(--ink-soft); margin-top:2px;}
  .status-pill{
    font-size:11.5px; padding:3px 10px; border-radius:var(--radius-pill);
    background:var(--gold-soft); color:#7A5C0E; font-weight:500; white-space:nowrap;
  }
  .status-pill.done{background:var(--good-soft); color:var(--good);}
  .empty-state{
    text-align:center; padding:50px 20px; color:var(--ink-soft);
  }
  .empty-state h3{color:var(--ink); margin-bottom:8px;}

  /* ---------- Trip detail tabs ---------- */
  .trip-header{
    display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:6px;
  }
  .trip-header .route{color:var(--ink-soft); font-size:13.5px; margin-top:4px;}
  .back-link{
    font-size:13px; color:var(--ink-soft); text-decoration:none; display:inline-block; margin-bottom:14px; cursor:pointer;
  }
  .tabs{
    display:flex; gap:4px; overflow-x:auto; border-bottom:1px solid var(--line); margin-bottom:18px; padding-bottom:0;
  }
  .tab-btn{
    background:none; border:none; padding:9px 13px; font-size:13.5px; color:var(--ink-soft);
    border-bottom:2px solid transparent; white-space:nowrap;
  }
  .tab-btn.active{color:var(--ink); border-color:var(--accent); font-weight:700;}

  table.data-table{width:100%; border-collapse:collapse; font-size:13.5px;}
  table.data-table th{
    text-align:left; padding:8px 10px; color:var(--ink-soft); font-weight:500; font-size:12.5px;
    border-bottom:1px solid var(--ink); white-space:nowrap;
  }
  table.data-table td{padding:9px 10px; border-bottom:1px solid var(--line); vertical-align:middle;}
  table.data-table tr:last-child td{border-bottom:none;}

  .amount{font-variant-numeric:tabular-nums; font-weight:600;}
  .amount.pos{color:var(--good);}
  .amount.neg{color:var(--accent);}

  .kpi-row{display:flex; gap:14px; flex-wrap:wrap; margin-bottom:6px;}
  .kpi{
    flex:1; min-width:140px; border:1px solid var(--line); border-radius:3px; padding:12px 14px; background:#FCFBF8;
  }
  .kpi .kpi-label{font-size:12px; color:var(--ink-soft);}
  .kpi .kpi-value{font-family:'Zen Old Mincho',serif; font-size:22px; margin-top:2px; font-variant-numeric:tabular-nums;}

  .transfer-item{
    display:flex; align-items:center; justify-content:space-between;
    padding:12px 14px; border:1px solid var(--line); border-radius:3px; margin-bottom:8px; background:#FCFBF8;
  }
  .transfer-item .who{font-size:14px;}
  .transfer-item .who .arrow{color:var(--accent); margin:0 6px;}
  .transfer-item .status-tag{font-size:11.5px; padding:3px 9px; border-radius:var(--radius-pill);}
  .status-tag.unpaid{background:var(--gold-soft); color:#7A5C0E;}
  .status-tag.pending{background:#EBE3F2; color:#6A4A8A;}
  .status-tag.done{background:var(--good-soft); color:var(--good);}

  .badge-owner{
    font-size:10.5px; background:var(--ink); color:#fff; padding:2px 7px; border-radius:var(--radius-pill); margin-left:6px;
  }

  .modal-overlay{
    position:fixed; inset:0; background:rgba(30,58,52,.35); display:flex; align-items:flex-start; justify-content:center;
    padding:40px 16px; overflow-y:auto; z-index:50;
  }
  .modal{
    background:#fff; border-radius:5px; max-width:520px; width:100%; padding:24px; margin-top:20px;
  }

  .invite-box{
    display:flex; align-items:center; gap:8px; background:#FCFBF8; border:1px dashed var(--line);
    border-radius:3px; padding:12px 14px; font-family:monospace; font-size:13px; word-break:break-all; margin-bottom:12px;
  }

  .ocr-drop{
    border:1.5px dashed var(--line); border-radius:4px; padding:22px; text-align:center; color:var(--ink-soft); font-size:13px; margin-bottom:14px; background:#FCFBF8;
  }
  .ocr-drop input{margin-top:10px;}

  .toast{
    position:fixed; bottom:22px; left:50%; transform:translateX(-50%);
    background:var(--ink); color:#fff; padding:11px 20px; border-radius:var(--radius-pill);
    font-size:13.5px; box-shadow:0 4px 16px rgba(0,0,0,.25); z-index:100; opacity:0; pointer-events:none; transition:opacity .2s, transform .2s;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(-4px);}

  .icon-btn{background:none; border:none; color:var(--ink-soft); font-size:16px; padding:4px 6px;}
  .icon-btn:hover{color:var(--accent);}
  .flow-note{font-size:12.5px; color:var(--ink-soft); margin-top:10px; border-left:2px solid var(--line); padding-left:10px;}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>

<script>
/* =========================================================
   旅費メモ - state & persistence
========================================================= */
const STORAGE_KEY = 'tabihimemo:data:v1';

let state = {
  profile: null,           // {name, age, license, drink, smoke}
  currentUserId: 'me',
  trips: [],                // Trip[]
  view: 'loading',          // loading | onboarding | tripList | tripDetail
  currentTripId: null,
  currentTab: 'estimate',
  roundingRotation: {}       // tripId -> last index used for rotation method
};

function uid(prefix){ return prefix + '_' + Math.random().toString(36).slice(2,9); }

async function saveState(){
  try{
    await window.storage.set(STORAGE_KEY, JSON.stringify({
      profile: state.profile, trips: state.trips, roundingRotation: state.roundingRotation
    }), false);
  }catch(e){ console.error('保存に失敗しました', e); }
}

async function loadState(){
  try{
    const res = await window.storage.get(STORAGE_KEY, false);
    if(res && res.value){
      const data = JSON.parse(res.value);
      state.profile = data.profile || null;
      state.trips = data.trips || [];
      state.roundingRotation = data.roundingRotation || {};
    }
  }catch(e){
    // キーが無い場合はエラーになるので何もしない
  }
  state.view = state.profile ? 'tripList' : 'onboarding';
  render();
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(()=> t.classList.remove('show'), 2200);
}

/* =========================================================
   Helpers
========================================================= */
function yen(n){
  const v = Math.round(n || 0);
  return (v<0?'-':'') + '¥' + Math.abs(v).toLocaleString('ja-JP');
}
function findTrip(id){ return state.trips.find(t=>t.id===id); }
function currentTrip(){ return findTrip(state.currentTripId); }
function memberName(trip, userId){
  const m = trip.members.find(m=>m.id===userId);
  return m ? m.name : '（不明）';
}
function isOwner(trip, userId){
  const m = trip.members.find(m=>m.id===userId);
  return !!(m && m.owner);
}

// 金額入力欄にカンマ区切り表示を適用する
function formatMoneyInput(el){
  const digits = String(el.value).replace(/[^0-9]/g,'');
  const caretWasAtEnd = el.selectionStart === el.value.length;
  el.value = digits === '' ? '' : Number(digits).toLocaleString('ja-JP');
  if(caretWasAtEnd){
    el.setSelectionRange(el.value.length, el.value.length);
  }
}
// カンマ区切り表示の入力欄から数値を取り出す
function getNumberValue(id){
  const el = document.getElementById(id);
  if(!el) return 0;
  return Number(String(el.value).replace(/[^0-9]/g,'')) || 0;
}
// 汎用の「はい/いいえ」確認モーダル
function openYesNoModal(question, onYes, onNo){
  const root = document.getElementById('modal-root');
  if(!root) return;
  root.innerHTML = `
  <div class="modal-overlay" id="yn-overlay">
    <div class="modal" style="max-width:400px;">
      <p style="font-size:15px; margin:0 0 20px 0;">${escapeHtml(question)}</p>
      <div class="btn-row">
        <button class="btn accent" id="yn-yes">はい</button>
        <button class="btn secondary" id="yn-no">いいえ</button>
      </div>
    </div>
  </div>`;
  document.getElementById('yn-yes').onclick = ()=>{ root.innerHTML=''; if(onYes) onYes(); };
  document.getElementById('yn-no').onclick = ()=>{ root.innerHTML=''; if(onNo) onNo(); };
  document.getElementById('yn-overlay').addEventListener('click', (e)=>{
    if(e.target.id==='yn-overlay'){ root.innerHTML=''; if(onNo) onNo(); }
  });
}

const ESTIMATE_CATEGORIES = [
  ['transport','交通費'], ['lodging','宿泊費'], ['food','食費'],
  ['sightseeing','観光費'], ['souvenir','お土産'], ['other','その他']
];

/* =========================================================
   Core calculations: 割り勘 / 立替 / 端数調整 / 最小送金
========================================================= */

// 端数処理: 合計を人数で割り、unitに合わせて基準額を決め、余りを method に従って配分する
function computeShares(trip){
  const members = trip.members;
  const n = members.length || 1;
  const unit = trip.roundingUnit || 1;
  const totalActual = trip.expenses.reduce((s,e)=> s + (Number(e.actual)||0), 0);

  const base = Math.floor((totalActual / n) / unit) * unit;
  let remainder = totalActual - base * n;
  const extraUnits = unit>0 ? Math.round(remainder / unit) : 0;

  const shareMap = {};
  members.forEach(m => shareMap[m.id] = base);

  // 余りを負担する順番を method ごとに決める
  let order = members.map(m=>m.id);
  const method = trip.roundingMethod || 'random';

  if(method === 'owner'){
    // オーナーがすべて負担
    order = members.filter(m=>m.owner).map(m=>m.id).concat(members.filter(m=>!m.owner).map(m=>m.id));
  } else if(method === 'rotation'){
    const idx = state.roundingRotation[trip.id] || 0;
    order = members.map((m,i)=> members[(i+idx)%members.length].id);
    state.roundingRotation[trip.id] = (idx + 1) % members.length;
  } else if(method === 'payer_priority'){
    // 立替回数(支払った回数)が多い人ほど負担を軽減 -> 支払い回数が少ない順に負担
    const payCount = {};
    members.forEach(m=> payCount[m.id]=0);
    trip.expenses.forEach(e=>{ if(payCount[e.payer]!==undefined) payCount[e.payer]++; });
    order = [...members].sort((a,b)=> payCount[a.id]-payCount[b.id]).map(m=>m.id);
  } else {
    // random（デモとして毎回シャッフル）
    order = [...order].sort(()=>Math.random()-0.5);
  }

  for(let i=0; i<extraUnits && i<order.length; i++){
    shareMap[order[i]] += unit;
  }
  // 万一 unit が totalActual を割り切らない端数が残った場合、最後の一人に足す
  let assigned = Object.values(shareMap).reduce((a,b)=>a+b,0);
  const leftover = totalActual - assigned;
  if(leftover !== 0 && members.length){
    shareMap[members[members.length-1].id] += leftover;
  }
  return { shareMap, totalActual };
}

// 立替金額(支払った額) - 分担額(share) の収支を出す
function computeBalances(trip){
  const { shareMap, totalActual } = computeShares(trip);
  const paid = {};
  trip.members.forEach(m=> paid[m.id]=0);
  trip.expenses.forEach(e=>{ if(paid[e.payer]!==undefined) paid[e.payer] += Number(e.actual)||0; });

  const balances = {};
  trip.members.forEach(m=>{
    balances[m.id] = (paid[m.id]||0) - (shareMap[m.id]||0);
  });
  return { balances, paid, shareMap, totalActual };
}

// 最小送金アルゴリズム: 貸方・借方を突き合わせ、送金回数が最小になるよう計算する
function computeMinimalTransfers(balances){
  const creditors = []; // 受け取る人 (balance > 0)
  const debtors = [];   // 支払う人 (balance < 0)
  Object.entries(balances).forEach(([id, v])=>{
    const val = Math.round(v);
    if(val > 0) creditors.push({id, amount: val});
    else if(val < 0) debtors.push({id, amount: -val});
  });
  creditors.sort((a,b)=> b.amount - a.amount);
  debtors.sort((a,b)=> b.amount - a.amount);

  const transfers = [];
  let ci = 0, di = 0;
  while(ci < creditors.length && di < debtors.length){
    const c = creditors[ci], d = debtors[di];
    const amount = Math.min(c.amount, d.amount);
    if(amount > 0){
      transfers.push({ payer: d.id, receiver: c.id, amount });
    }
    c.amount -= amount;
    d.amount -= amount;
    if(c.amount <= 0) ci++;
    if(d.amount <= 0) di++;
  }
  return transfers;
}

// 精算確定: trip.settlements に最小送金の結果を書き込む(未確定分のみ生成)
function ensureSettlements(trip){
  const { balances } = computeBalances(trip);
  const transfers = computeMinimalTransfers(balances);
  // 既存のものと突き合わせて再利用(進行中の確認状態を保つ)
  const newList = transfers.map(t=>{
    const existing = trip.settlements.find(s=> s.payer===t.payer && s.receiver===t.receiver && !s.receiptConfirmed===false && s.amount === t.amount);
    if(existing) return existing;
    const reuse = trip.settlements.find(s=> s.payer===t.payer && s.receiver===t.receiver && !s.receiptConfirmed);
    if(reuse){ reuse.amount = t.amount; return reuse; }
    return { id: uid('stl'), payer: t.payer, receiver: t.receiver, amount: t.amount, paymentCompleted:false, receiptConfirmed:false, completedAt:null };
  });
  trip.settlements = newList;
}

function settlementStatus(s){
  return (s.paymentCompleted && s.receiptConfirmed) ? 'done' : 'unpaid';
}

/* =========================================================
   Rendering: root dispatcher
========================================================= */
function render(){
  const app = document.getElementById('app');
  if(state.view === 'loading'){ app.innerHTML = ''; return; }
  if(state.view === 'onboarding'){ app.innerHTML = topbar(false) + renderOnboarding(); bindOnboarding(); return; }
  if(state.view === 'tripList'){ app.innerHTML = topbar(true) + renderTripList(); bindTripList(); return; }
  if(state.view === 'tripDetail'){ app.innerHTML = topbar(true) + renderTripDetail(); bindTripDetail(); return; }
}

function topbar(showWho){
  return `
  <div class="topbar">
    <div class="brand">
      <div class="stamp">旅</div>
      <h1>旅費メモ</h1>
    </div>
    ${showWho && state.profile ? `
    <div class="who">
      ${state.profile.name} さん<br>
      <button id="btn-edit-profile">プロフィールを編集</button>
    </div>` : ''}
  </div>`;
}

/* =========================================================
   Onboarding (3.1 初期登録画面)
========================================================= */
function renderOnboarding(){
  const p = state.profile || { name:'', age:'', license:false, drink:false, smoke:false };
  return `
  <main>
    <div class="card" style="max-width:480px;margin:20px auto;">
      <div class="section-title"><h2>プロフィール登録</h2></div>
      <p class="muted">旅費メモを使い始めるために、あなたの情報を登録してください。</p>
      <div class="field">
        <label>氏名 <span style="color:var(--accent)">*</span></label>
        <input type="text" id="f-name" value="${escapeHtml(p.name)}" placeholder="例）山田 太郎">
      </div>
      <div class="field">
        <label>年齢 <span style="color:var(--accent)">*</span></label>
        <input type="number" id="f-age" min="0" value="${p.age||''}" placeholder="例）28">
      </div>

function categoryLabel(k){ const f = ESTIMATE_CATEGORIES.find(c=>c[0]===k); return f?f[1]:k; }

// レシート画像 → base64 → Claude(画像認識)に送信し、費目・金額・日付・店舗名を実データとして抽出する
function fileToBase64(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=> resolve(reader.result.split(',')[1]);
    reader.onerror = ()=> reject(new Error('画像の読み込みに失敗しました'));
    reader.readAsDataURL(file);
  });
}
// オフラインOCR（Tesseract.js／無料・端末内処理）。生テキストから正規表現で金額・日付・店舗名を推定抽出する
async function runReceiptOcrOffline(file, onProgress){
  const { data } = await Tesseract.recognize(file, 'jpn+eng', {
    logger: (m)=>{
      if(onProgress && m.status === 'recognizing text'){
        onProgress(Math.round((m.progress||0) * 100));
      }
    }
  });
  const text = data.text || '';
  return parseReceiptText(text);
}
function parseReceiptText(text){
  const lines = text.split('\n').map(l=>l.trim()).filter(Boolean);

  // 金額: 「合計」を含む行を優先し、そこから金額らしき数字を取る。無ければ「小計」、それも無ければ文中最大の金額。
  let amount = null;
  const totalLine = lines.find(l=>/合\s*計/.test(l));
  const subtotalLine = lines.find(l=>/小\s*計/.test(l));
  const amountFrom = (line)=>{
    if(!line) return null;
    const m = line.match(/([0-9][0-9,]{1,7})/g);
    if(!m) return null;
    const n = Number(m[m.length-1].replace(/,/g,''));
    return isNaN(n) ? null : n;
  };
  amount = amountFrom(totalLine) || amountFrom(subtotalLine);
  if(!amount){
    const all = text.match(/[0-9][0-9,]{2,7}/g) || [];
    const nums = all.map(s=>Number(s.replace(/,/g,''))).filter(n=>!isNaN(n) && n>0 && n<1000000);
    if(nums.length) amount = Math.max(...nums);
  }

  // 日付: 2026/09/25・2026-09-25・2026年9月25日 などの表記に対応
  let date = null;
  const dateMatch = text.match(/(20\d{2})[\/\-年](\d{1,2})[\/\-月](\d{1,2})/);
  if(dateMatch){
    const y = dateMatch[1], m = String(dateMatch[2]).padStart(2,'0'), d = String(dateMatch[3]).padStart(2,'0');
    date = `${y}-${m}-${d}`;
  }

  // 店舗名: 先頭付近の、数字だけではない行を店舗名の候補とする（簡易推定）
  const store = lines.slice(0,6).find(l=> l.length>=2 && !/^[0-9¥,.\-\s]+$/.test(l)) || null;

  return { category: null, amount, date, store, memo: null, rawText: text };
}

async function runReceiptOcr(file){
  const base64 = await fileToBase64(file);
  const mediaType = file.type || 'image/jpeg';
  const categoryKeys = ESTIMATE_CATEGORIES.map(c=>c[0]).join('|');
  const prompt = `このレシート画像を読み取り、次のJSON形式のみで回答してください。説明文やコードブロック記号（\`\`\`）は一切付けないでください。
{"category":"(${categoryKeys})のいずれか","amount":合計金額を表す数値(円、カンマなし),"date":"YYYY-MM-DD形式の支払日(西暦に変換)","store":"店舗名","memo":"購入した商品名など短いメモ"}
金額はレシートの「合計」金額を使用してください。読み取れない項目はnullにしてください。`;

  const response = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      model: 'claude-sonnet-4-6',
      max_tokens: 1000,
      messages: [{
        role: 'user',
        content: [
          { type: 'image', source: { type: 'base64', media_type: mediaType, data: base64 } },
          { type: 'text', text: prompt }
        ]
      }]
    })
  });
  if(!response.ok){
    throw new Error('APIエラー(' + response.status + ')');
  }
  const data = await response.json();
  const text = (data.content||[]).map(b=> b.text || '').join('');
  const cleaned = text.replace(/```json|```/g,'').trim();
  let parsed;
  try{
    parsed = JSON.parse(cleaned);
  }catch(e){
    throw new Error('読み取り結果の解析に失敗しました');
  }
  return parsed;
}

function bindExpenseTab(trip){

}

/* =========================================================
   3.6 精算画面 + 4.6 最小送金 + 4.7 双方確認
========================================================= */
function renderSettlementTab(trip){
  const totalEstimate = ESTIMATE_CATEGORIES.reduce((s,[k])=> s + (Number(trip.estimate[k])||0), 0);
  const { balances, paid, shareMap, totalActual } = computeBalances(trip);
  const diff = totalActual - totalEstimate;

  const balanceRows = trip.members.map(m=>{
    const bal = balances[m.id] || 0;
    return `<tr>
      <td>${escapeHtml(m.name)}${m.owner?'<span class="badge-owner">オーナー</span>':''}</td>
      <td class="amount">${yen(paid[m.id]||0)}</td>
      <td class="amount">${yen(shareMap[m.id]||0)}</td>
      <td class="amount ${bal>=0?'pos':'neg'}">${bal>=0?'受取 '+yen(bal):'立替 '+yen(-bal)}</td>
    </tr>`;
  }).join('');

  const transferRows = trip.settlements.map(s=>{
    const st = settlementStatus(s);
    const label = st==='done' ? '清算済み' : '未払い';
    return `
    <div class="transfer-item">
      <div class="who">${escapeHtml(memberName(trip,s.payer))} <span class="arrow">→</span> ${escapeHtml(memberName(trip,s.receiver))} の支払い <strong>${yen(s.amount)}</strong></div>
      <span class="status-tag ${st}">${label}</span>
    </div>`;
  }).join('');

  return `
  <div class="card">
    <div class="section-title"><h2>見積もりとの差額</h2></div>
    <div class="kpi-row">
      <div class="kpi"><div class="kpi-label">見積額</div><div class="kpi-value">${yen(totalEstimate)}</div></div>
      <div class="kpi"><div class="kpi-label">実費合計</div><div class="kpi-value">${yen(totalActual)}</div></div>
      <div class="kpi"><div class="kpi-label">差額</div><div class="kpi-value" style="color:${diff>0?'var(--accent)':'var(--good)'}">${diff>=0?'+':''}${yen(diff)}</div></div>
    </div>
  </div>
  <div class="card">
    <div class="section-title"><h2>収支一覧</h2><span class="muted">精算単位：${trip.roundingUnit}円 ／ 端数負担：${roundingMethodLabel(trip.roundingMethod)}</span></div>
    <table class="data-table">
      <thead><tr><th>参加者</th><th>支払った額</th><th>分担額</th><th>収支</th></tr></thead>
      <tbody>${balanceRows}</tbody>
    </table>
    <div class="btn-row"><button class="btn accent" id="btn-calc-settlement">最小送金で精算を計算</button></div>
  </div>
  <div class="card">
    <div class="section-title"><h2>精算結果（送金回数が最小になるよう計算）</h2></div>
    ${trip.settlements.length ? transferRows : '<p class="muted">「最小送金で精算を計算」を押すと結果が表示されます。</p>'}
  </div>`;
}
function roundingMethodLabel(m){
  return {random:'ランダム', rotation:'持ち回り', owner:'管理者負担', payer_priority:'立替者優先'}[m] || m;
}
function bindSettlementTab(trip){
  document.getElementById('btn-calc-settlement').onclick = ()=>{
    ensureSettlements(trip);
    saveState(); render(); showToast('精算結果を計算しました');
  };
}

/* =========================================================
   3.7 支払い管理画面 (4.7 双方確認による精算完了)
========================================================= */
function renderPaymentTab(trip){
  if(!trip.settlements.length){
    return `<div class="card"><p class="muted">まだ精算結果がありません。「精算」タブで計算してください。</p></div>`;
  }
  const rows = trip.settlements.map(s=>{
    const st = settlementStatus(s);
    const label = st==='done' ? '清算済み' : '未払い';
    const payerName = escapeHtml(memberName(trip,s.payer));
    const receiverName = escapeHtml(memberName(trip,s.receiver));
    return `
    <div class="transfer-item" style="flex-direction:column; align-items:stretch; gap:10px;">
      <div style="display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:8px;">
        <div class="who">${payerName} <span class="arrow">→</span> ${receiverName} の支払い <strong>${yen(s.amount)}</strong></div>
        <span class="status-tag ${st}">${label}</span>
      </div>
      <div style="display:flex; gap:18px; flex-wrap:wrap; font-size:13px; color:var(--ink-soft);">
        <div>
          送金人（${payerName}）：${s.paymentCompleted ? '支払い済みと回答' : '未回答'}
          <button class="btn ghost sm btn-toggle-pay" data-id="${s.id}">${s.paymentCompleted ? '回答を修正' : '回答する'}</button>
        </div>
        <div>
          受取人（${receiverName}）：${s.receiptConfirmed ? '受け取り済みと回答' : '未回答'}
          <button class="btn ghost sm btn-toggle-receive" data-id="${s.id}">${s.receiptConfirmed ? '回答を修正' : '回答する'}</button>
        </div>
      </div>
      ${st==='done' && s.completedAt ? `<div class="muted">清算済み日時：${s.completedAt}</div>` : ''}
    </div>`;
  }).join('');

  return `
  <div class="card">
    <div class="section-title"><h2>支払い管理</h2><span class="muted">送金人・受取人の双方が「はい」と回答すると清算済みになります</span></div>
    ${rows}
  </div>`;
}
function bindPaymentTab(trip){
  function afterAnswer(s){
    if(s.paymentCompleted && s.receiptConfirmed){
      s.completedAt = new Date().toLocaleString('ja-JP');
      showToast('精算が完了しました。');
    } else {
      s.completedAt = null;
      showToast('回答を更新しました。');
    }
    saveState(); render();
  }
  document.querySelectorAll('.btn-toggle-pay').forEach(el=>{
    el.onclick = ()=>{
      const s = trip.settlements.find(x=>x.id===el.dataset.id);
      const receiverName = memberName(trip, s.receiver);
      openYesNoModal(`${receiverName}さんに代金を支払いましたか？`,
        ()=>{ s.paymentCompleted = true; afterAnswer(s); },
        ()=>{ s.paymentCompleted = false; afterAnswer(s); }
      );
    };
  });
  document.querySelectorAll('.btn-toggle-receive').forEach(el=>{
    el.onclick = ()=>{
      const s = trip.settlements.find(x=>x.id===el.dataset.id);
      const payerName = memberName(trip, s.payer);
      openYesNoModal(`${payerName}さんから代金を受け取りましたか？`,
        ()=>{ s.receiptConfirmed = true; afterAnswer(s); },
        ()=>{ s.receiptConfirmed = false; afterAnswer(s); }
      );
    };
  });
}

/* =========================================================
   3.8 参加者管理画面
========================================================= */
function renderMembersTab(trip){
  const iAmOwner = isOwner(trip, state.currentUserId);
  const rows = trip.members.map(m=>`
    <tr>
      <td>${escapeHtml(m.name)}${m.owner?'<span class="badge-owner">オーナー</span>':''}</td>
      <td>${m.owner?'オーナー':'一般'}</td>
      <td>招待URL</td>
      <td>
        ${iAmOwner && !m.owner ? `<button class="btn ghost btn-make-owner" data-id="${m.id}">権限変更</button>` : ''}
        ${trip.members.length>1 ? `<button class="btn ghost btn-remove-member" data-id="${m.id}">削除</button>` : ''}
      </td>
    </tr>`).join('');

  return `
  <div class="card">
    <div class="section-title"><h2>参加者一覧</h2></div>
    <table class="data-table">
      <thead><tr><th>名前</th><th>権限</th><th>招待方法</th><th></th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
    ${!iAmOwner ? `<p class="muted" style="margin-top:6px;">権限の変更はオーナーのみが行えます。</p>` : ''}
    <div class="btn-row"><button class="btn secondary" id="btn-add-member-demo">参加者を追加（デモ）</button></div>
    <p class="muted" style="margin-top:6px;">実際の招待は「招待」タブで発行したURLを共有してください。</p>
  </div>
  <div class="card">
    <div class="section-title"><h2>端数調整の設定</h2></div>
    <div class="grid2">
      <div class="field">
        <label>精算単位</label>
        <select id="round-unit">
          <option value="1">1円（通常）</option>
          <option value="10">10円単位</option>
          <option value="100">100円単位</option>
          <option value="500">500円単位</option>
          <option value="1000">1000円単位</option>
        </select>
      </div>
      <div class="field">
        <label>端数負担方法</label>
        <select id="round-method">
          <option value="random">ランダム</option>
          <option value="rotation">持ち回り</option>
          <option value="owner">管理者負担</option>
          <option value="payer_priority">立替者優先</option>
        </select>
      </div>
    </div>
    <div class="btn-row"><button class="btn accent" id="btn-save-rounding">設定を保存</button></div>
  </div>`;
}
function bindMembersTab(trip){
  document.getElementById('round-unit').value = String(trip.roundingUnit);
  document.getElementById('round-method').value = trip.roundingMethod;
  document.getElementById('btn-save-rounding').onclick = ()=>{
    trip.roundingUnit = Number(document.getElementById('round-unit').value);
    trip.roundingMethod = document.getElementById('round-method').value;
    saveState(); render(); showToast('端数調整の設定を保存しました');
  };
  document.getElementById('btn-add-member-demo').onclick = ()=>{
    const name = prompt('参加者の名前を入力してください');
    if(!name) return;
    trip.members.push({ id: uid('mem'), name: name.trim(), owner:false });
    saveState(); render(); showToast('参加者を追加しました');
  };
  document.querySelectorAll('.btn-make-owner').forEach(el=>{
    el.onclick = ()=>{
      if(!isOwner(trip, state.currentUserId)){
        showToast('権限の変更はオーナーのみが行えます');
        return;
      }
      const m = trip.members.find(x=>x.id===el.dataset.id);
      if(!m || m.owner) return;
      openYesNoModal(`${m.name}さんにオーナーの権限を譲渡しますか？`,
        ()=>{
          // オーナーは一人だけになるよう、既存のオーナーを解除してから譲渡する
          trip.members.forEach(x=> x.owner = false);
          m.owner = true;
          saveState(); render();
          showToast(`${m.name}さんにオーナー権限を譲渡しました`);
        },
        ()=>{ /* いいえ：権限は変更しない */ }
      );
    };
  });
  document.querySelectorAll('.btn-remove-member').forEach(el=>{
    el.onclick = ()=>{
      trip.members = trip.members.filter(x=>x.id!==el.dataset.id);
      saveState(); render(); showToast('参加者を削除しました');
    };
  });
}

/* =========================================================
   3.9 招待画面
========================================================= */
function renderInviteTab(trip){
  const invite = trip.invite;
  return `
  <div class="card">
    <div class="section-title"><h2>招待</h2></div>
    ${invite ? `
      <div class="invite-box" id="invite-url">${invite.url}</div>
      <p class="muted">有効期限：${invite.expiry} ／ 利用回数：残り ${invite.remaining} 回</p>
      <div class="btn-row">
        <button class="btn secondary" id="btn-copy-invite">コピー</button>
        <button class="btn ghost" id="btn-reissue-invite">URLを再発行</button>
      </div>
    ` : `
      <p class="muted">招待URLを発行して、旅行の参加者に共有しましょう。</p>
      <div class="btn-row"><button class="btn accent" id="btn-issue-invite">URL発行</button></div>
    `}
  </div>`;
}
function bindInviteTab(trip){
  const issueBtn = document.getElementById('btn-issue-invite');
  if(issueBtn) issueBtn.onclick = ()=>{
    const token = Math.random().toString(36).slice(2,10) + Math.random().toString(36).slice(2,10);
    const expiry = new Date(Date.now() + 7*24*3600*1000).toISOString().slice(0,10);
    trip.invite = { url: `https://tabihi-memo.example.com/join/${token}`, expiry, remaining: 5 };
    saveState(); render(); showToast('招待URLを発行しました');
  };
  const reissueBtn = document.getElementById('btn-reissue-invite');
  if(reissueBtn) reissueBtn.onclick = ()=>{ trip.invite = null; saveState(); render(); };
  const copyBtn = document.getElementById('btn-copy-invite');
  if(copyBtn) copyBtn.onclick = async ()=>{
    try{
      await navigator.clipboard.writeText(trip.invite.url);
      showToast('URLをコピーしました');
    }catch(e){ showToast('コピーできませんでした。手動で選択してください。'); }
  };
}

/* =========================================================
   3.10 通知設定画面
========================================================= */
function renderNotifyTab(trip){
  const n = trip.notifications;
  return `
  <div class="card">
    <div class="section-title"><h2>通知設定</h2></div>
    ${toggleRow('notify-settlement','精算通知','精算内容が更新されたときに通知します', n.settlement)}
    ${toggleRow('notify-reminder','リマインド通知','未入力の実費や見積もりをお知らせします', n.reminder)}
    ${toggleRow('notify-deadline','支払い期限通知','支払い期限が近づくとお知らせします', n.deadline)}
    <div class="btn-row"><button class="btn accent" id="btn-save-notify">保存</button></div>
  </div>`;
}
function bindNotifyTab(trip){
  document.getElementById('btn-save-notify').onclick = ()=>{
    trip.notifications = {
      settlement: document.getElementById('notify-settlement').checked,
      reminder: document.getElementById('notify-reminder').checked,
      deadline: document.getElementById('notify-deadline').checked,
    };
    saveState(); render(); showToast('通知設定を保存しました');
  };
}

/* =========================================================
   utils & boot
========================================================= */
function escapeHtml(str){
  return String(str==null?'':str).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

loadState();
</script>
