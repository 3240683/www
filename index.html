<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>旅費メモ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>

<script src="common.js"></script>
<script src="firebase-config.js"></script>
<script src="cloud.js"></script>
<script>
/* =========================================================
   index.html: プロフィール登録 / 旅行一覧 / 旅行作成
========================================================= */
let view = 'onboarding';

function render() {
  const app = document.getElementById('app');
  if (view === 'onboarding') {
    // 追加: プロフィールをまだ作っていない端末（新しい端末など）でも、バックアップの読み込みやログインができるようにする
    const cloud = (typeof Cloud !== 'undefined' && Cloud.configured()) ? `<div id="cloud-slot">${Cloud.renderCard()}</div>` : '';
    const extra = state.profile ? '' : `<main style="padding-top:0;max-width:720px;margin:0 auto;">${renderDataCard()}${cloud}</main>${modalHost()}`;
    app.innerHTML = topbar(false) + renderOnboarding() + extra;
    bindOnboarding();
    if (!state.profile) { bindDataCard(); if (typeof Cloud !== 'undefined') Cloud.bindCard(); }
    return;
  }
  if (view === 'tripList') {
    app.innerHTML = topbar(true) + renderTripList();
    bindTripList();
  }
}

/* ---- プロフィール登録 ---- */
function renderOnboarding() {
  const p = state.profile || {
    name: '', age: '', license: false, drink: false, smoke: false
  };

  return `
  <main>
    <div class="card" style="max-width:480px;margin:20px auto;">
      <div class="section-title"><h2>プロフィール登録</h2></div>
      <p class="muted">旅費メモを使い始めるために、あなたの情報を登録してください。</p>
      <div class="field">
        <label>氏名 <span style="color:var(--accent)">*</span></label>
        <input type="text" id="f-name" value="${escapeHtml(p.name)}" placeholder="例）山田 太郎">
      </div>
      <div class="field">
        <label>年齢 <span style="color:var(--accent)">*</span></label>
        <input type="number" id="f-age" min="0" value="${p.age || ''}" placeholder="例）28">
      </div>
      ${toggleRow('f-license', '運転免許', '交通手段の提案に利用します', p.license)}
      ${toggleRow('f-drink', '飲酒', 'お店選びの参考にします', p.drink)}
      ${toggleRow('f-smoke', '喫煙', '宿泊先の提案に利用します', p.smoke)}
      <div class="btn-row">
        <button class="btn accent" id="btn-save-profile">登録</button>
        ${state.profile ? '<button class="btn secondary" id="btn-cancel-profile">キャンセル</button>' : ''}
      </div>
    </div>
  </main>`;
}

function bindOnboarding() {
  document.getElementById('btn-save-profile').onclick = () => {
    const name = document.getElementById('f-name').value.trim();
    const ageText = document.getElementById('f-age').value;
    const age = Number(ageText);

    if (!name || ageText.trim() === '' || !Number.isFinite(age) || age < 0) {
      showToast('氏名と正しい年齢を入力してください');
      return;
    }

    state.profile = {
      name,
      age,
      license: document.getElementById('f-license').checked,
      drink: document.getElementById('f-drink').checked,
      smoke: document.getElementById('f-smoke').checked
    };

    saveState();
    view = 'tripList';
    render();
    showToast('登録しました');
  };

  const cancelBtn = document.getElementById('btn-cancel-profile');
  if (cancelBtn) {
    cancelBtn.onclick = () => {
      view = 'tripList';
      render();
    };
  }
}

/* ---- 旅行一覧 ---- */
function renderTripList() {
  const rows = state.trips.map(t => {
    const st = tripStatusLabel(t);
    return `
    <div class="trip-card" data-id="${t.id}">
      <div>
        <div style="font-weight:700;font-size:15.5px;">${escapeHtml(t.title)}</div>
        <div class="route">${escapeHtml(t.departure)} → ${escapeHtml(t.destination)}</div>
        <div class="dates">${t.startDate || '?'} 〜 ${t.endDate || '?'}</div>
      </div>
      <div style="display:flex;align-items:center;gap:10px;">
        <span class="status-pill ${st.done ? 'done' : ''}">${st.text}</span>
        <button class="icon-btn btn-edit-trip" data-id="${t.id}" title="編集">✎</button>
        <button class="icon-btn btn-delete-trip" data-id="${t.id}" title="削除">🗑</button>
      </div>
    </div>`;
  }).join('');

  return `
  <main>
    <div class="trip-list-header">
      <h2 style="margin:0;">旅行一覧</h2>
      <button class="btn accent" id="btn-new-trip">＋ 新規作成</button>
    </div>
    ${state.trips.length ? rows : `
      <div class="empty-state">
        <h3>まだ旅行がありません</h3>
        <p>「新規作成」から最初の旅行を登録しましょう。</p>
      </div>`}
    ${renderDataCard()}
    ${typeof Cloud !== 'undefined' ? `<div id="cloud-slot">${Cloud.renderCard()}</div>` : ''}
  </main>
  ${modalHost()}`;
}

/* ▼▼▼ 追加: データの書き出し・読み込み（サーバーなしのバックアップ／別の端末への引き継ぎ）（ここから） ▼▼▼ */
function renderDataCard() {
  return `
  <div class="card" id="data-card" style="margin-top:20px;">
    <div class="section-title"><h2>データの管理</h2><span class="muted">バックアップ・別の端末への引き継ぎ</span></div>
    <p class="muted">旅行データは、この端末のブラウザ内にだけ保存されています。ブラウザのデータを消すと失われるので、ときどきファイルに書き出しておくと安心です。別の端末へ移すときは、書き出したファイルをその端末で読み込みます。</p>
    <label style="font-size:13px;display:flex;gap:6px;align-items:center;margin:8px 0;">
      <input type="checkbox" id="backup-images"> レシート画像も含める（ファイルが大きくなります）
    </label>
    <div class="btn-row">
      <button class="btn secondary" id="btn-export" type="button">データを書き出す</button>
      <button class="btn secondary" id="btn-import" type="button">データを読み込む</button>
      <input type="file" id="import-file" accept="application/json,.json" hidden>
    </div>
    <p class="muted" id="data-status" aria-live="polite" style="margin-top:10px;"></p>
  </div>`;
}

function bindDataCard() {
  const status = document.getElementById('data-status');
  const say = m => { if (status) status.textContent = m; };

  document.getElementById('btn-export').onclick = async () => {
    try {
      const withImages = document.getElementById('backup-images').checked;
      say('書き出しています…');
      const { backup, skippedImages } = await buildBackup(withImages);
      const d = new Date();
      const ymd = d.getFullYear() + String(d.getMonth() + 1).padStart(2, '0') + String(d.getDate()).padStart(2, '0');
      downloadJson(backup, `tabihimemo-backup-${ymd}.json`);
      say(`書き出しました（旅行${backup.trips.length}件` + (withImages ? `・画像${Object.keys(backup.receipts).length}枚` : '') +
          (skippedImages ? `。画像${skippedImages}枚は見つからず除きました` : '') + '）。');
    } catch (e) { console.error(e); say('書き出しに失敗しました：' + (e.message || e)); }
  };

  const fileInput = document.getElementById('import-file');
  document.getElementById('btn-import').onclick = () => fileInput.click();
  fileInput.onchange = async () => {
    const file = fileInput.files[0];
    fileInput.value = '';
    if (!file) return;
    let d;
    try { d = parseBackup(await file.text()); }
    catch (e) { say(e.message || '読み込めませんでした'); return; }
    const imgs = Object.keys(d.receipts || {}).length;
    const root = document.getElementById('modal-root');
    root.innerHTML = `
    <div class="modal-overlay" id="imp-overlay">
      <div class="modal" style="max-width:460px;">
        <h2>データを読み込む</h2>
        <p>旅行${d.trips.length}件${imgs ? `・画像${imgs}枚` : ''}を含むバックアップです。${d.exportedAt ? `<br><span class="muted">書き出し日時：${escapeHtml(new Date(d.exportedAt).toLocaleString('ja-JP'))}</span>` : ''}</p>
        <div class="btn-row" style="flex-direction:column;align-items:stretch;">
          <button class="btn accent" id="imp-merge" type="button">いまのデータに追加する（おすすめ）</button>
          <button class="btn secondary" id="imp-replace" type="button">いまのデータをすべて置き換える</button>
          <button class="btn ghost" id="imp-cancel" type="button">キャンセル</button>
        </div>
        <p class="muted" style="margin-top:10px;">「追加」は、いまの旅行を消さずに取り込みます（同じ旅行は重複しません）。</p>
      </div>
    </div>`;
    const done = async mode => {
      root.innerHTML = '';
      try {
        const r = await applyBackup(d, mode);
        if (state.profile && view === 'onboarding') view = 'tripList';     // 新しい端末で読み込んだ場合は、旅行一覧へ移る
        render();
        showToast(`読み込みました（追加${r.added}件` + (r.skipped ? `・同じ内容のため除外${r.skipped}件` : '') + (r.images ? `・画像${r.images}枚` : '') + '）');
      } catch (e) { console.error(e); say('読み込みに失敗しました：' + (e.message || e)); }
    };
    document.getElementById('imp-merge').onclick = () => done('merge');
    document.getElementById('imp-replace').onclick = () => {
      root.innerHTML = '';
      openYesNoModal('いまのデータはすべて消えて、ファイルの内容に置き換わります。よろしいですか？', () => done('replace'));
    };
    document.getElementById('imp-cancel').onclick = () => { root.innerHTML = ''; };
    document.getElementById('imp-overlay').addEventListener('click', e => { if (e.target.id === 'imp-overlay') root.innerHTML = ''; });
  };
}
/* ▲▲▲ 追加: データの書き出し・読み込み（ここまで） ▲▲▲ */

function bindTripList() {
  document.getElementById('btn-new-trip').onclick = () => openTripFormModal(null);
  bindDataCard();                                        // 追加: データの書き出し・読み込み
  if (typeof Cloud !== 'undefined') Cloud.bindCard();    // 追加: アカウント・クラウド同期

  document.querySelectorAll('.trip-card').forEach(el => {
    el.addEventListener('click', e => {
      if (e.target.closest('.btn-edit-trip') || e.target.closest('.btn-delete-trip')) return;
      state.currentTripId = el.dataset.id;
      saveState();
      location.href = 'estimate.html?trip=' + el.dataset.id;
    });
  });

  document.querySelectorAll('.btn-edit-trip').forEach(el => {
    el.onclick = e => {
      e.stopPropagation();
      openTripFormModal(el.dataset.id);
    };
  });

  document.querySelectorAll('.btn-delete-trip').forEach(el => {
    el.onclick = e => {
      e.stopPropagation();
      if (confirm('この旅行を削除しますか？')) {
        state.trips = state.trips.filter(t => t.id !== el.dataset.id);
        saveState();
        render();
        showToast('削除しました');
      }
    };
  });
}


/* ---- 旅行作成・編集モーダル ---- */
function openTripFormModal(tripId) {
  const trip = tripId ? findTrip(tripId) : null;
  const root = document.getElementById('modal-root');
  const old = trip?.transport || {};
  const yen = n => Math.round(n).toLocaleString('ja-JP') + '円';

  // Google Maps Platform のAPIキーを設定
  const GOOGLE_MAPS_API_KEY = '';

  root.innerHTML = `
    <div class="modal-overlay" id="modal-overlay">
      <div class="modal">
        <h2>${trip ? '旅行を編集' : '旅行を作成'}</h2>

        <div class="field">
          <label>旅行名 *</label>
          <input id="tf-title" placeholder="例）春の京都旅行"
            value="${escapeHtml(trip?.title || '')}">
        </div>

        <div class="grid2">
          <div class="field">
            <label>出発地 *</label>
            <input id="tf-departure" placeholder="例）東京駅"
              value="${escapeHtml(trip?.departure || '')}">
          </div>
          <div class="field">
            <label>目的地 *</label>
            <input id="tf-destination" placeholder="例）京都駅"
              value="${escapeHtml(trip?.destination || '')}">
          </div>
        </div>

        <div class="grid2">
          <div class="field">
            <label>開始日 *</label>
            <input type="date" id="tf-start" value="${trip?.startDate || ''}">
          </div>
          <div class="field">
            <label>終了日 *</label>
            <input type="date" id="tf-end" value="${trip?.endDate || ''}">
          </div>
        </div>

        <h3>交通費の計算</h3>
        <div class="field">
          <label>交通手段</label>
          <select id="tf-method">
            <option value="train">電車・新幹線</option>
            <option value="bus">高速バス</option>
            <option value="plane">飛行機</option>
            <option value="car">車</option>
            <option value="other">その他</option>
          </select>
        </div>

        <div class="field">
          <button class="btn secondary" type="button" id="tf-route-search">
            ルート・運賃検索
          </button>
          <p id="tf-route-result" class="muted">
            検索結果がここに表示されます。
          </p>
        </div>

        <div class="field">
          <label id="tf-fare-label">片道料金（1人分・円）</label>
          <input type="number" id="tf-fare" min="0" step="1"
            placeholder="例）5000" value="${old.oneWayFare ?? ''}">
        </div>

        <div class="field">
          <label>人数</label>
          <input type="number" id="tf-people" min="1" max="100"
            step="1" value="${old.people || trip?.members?.length || 1}">
        </div>

        <div class="field">
          <p>片道合計：<strong id="tf-one">0円</strong></p>
          <p>往復合計：<strong id="tf-round">0円</strong></p>
          <p>1人当たり：<strong id="tf-person">0円</strong></p>
        </div>

        <div class="field">
          <label>1人当たりの予算上限（円）</label>
          <input type="number" id="tf-budget" min="0"
            value="${trip?.budgetPerPerson || ''}" placeholder="例）30000">
        </div>

        <div class="btn-row">
          <button class="btn accent" id="tf-save">保存</button>
          <button class="btn secondary" id="tf-cancel">キャンセル</button>
        </div>
      </div>
    </div>`;

  const $ = id => document.getElementById(id);
  $('tf-method').value = old.method || 'train';

  function updateCost() {
    const fare = Math.max(0, Number($('tf-fare').value) || 0);
    const people = Math.max(1, Number($('tf-people').value) || 1);
    const isCar = $('tf-method').value === 'car';
    const oneWayTotal = isCar ? fare : fare * people;
    $('tf-fare-label').textContent = isCar
      ? '片道費用（車全体の合計・円）' : '片道料金（1人分・円）';
    $('tf-one').textContent = yen(oneWayTotal);
    $('tf-round').textContent = yen(oneWayTotal * 2);
    $('tf-person').textContent = yen(oneWayTotal * 2 / people);
  }

  $('tf-fare').addEventListener('input', updateCost);
  $('tf-people').addEventListener('input', updateCost);
  $('tf-method').addEventListener('change', updateCost);
  updateCost();

  $('tf-route-search').onclick = async () => {
    const origin = $('tf-departure').value.trim();
    const destination = $('tf-destination').value.trim();
    const method = $('tf-method').value;
    const result = $('tf-route-result');

    if (GOOGLE_MAPS_API_KEY === 'YOUR_API_KEY_HERE' ||
        !GOOGLE_MAPS_API_KEY.trim()) {
      result.textContent = 'コード内のAPIキーを設定してください。';
      return;
    }

    if (!origin || !destination) {
      result.textContent = '出発地と目的地を入力してください。';
      return;
    }

    if (method === 'plane' || method === 'other' || method === 'bus') {
      result.textContent =
        'この交通手段の運賃は自動取得できません。料金を手入力してください。';
      return;
    }

    result.textContent = '検索中です…';
    $('tf-route-search').disabled = true;

    try {
      const response = await fetch(
        'https://routes.googleapis.com/directions/v2:computeRoutes',
        {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-Goog-Api-Key': GOOGLE_MAPS_API_KEY,
            'X-Goog-FieldMask':
              'routes.distanceMeters,routes.duration,routes.travelAdvisory.transitFare'
          },
          body: JSON.stringify({
            origin: { address: origin },
            destination: { address: destination },
            travelMode: method === 'car' ? 'DRIVE' : 'TRANSIT',
            languageCode: 'ja',
            regionCode: 'JP'
          })
        }
      );

      const data = await response.json();

      if (!response.ok) {
        throw new Error(data.error?.message || `APIエラー ${response.status}`);
      }

      if (!data.routes || data.routes.length === 0) {
        result.textContent = 'ルートが見つかりませんでした。';
        return;
      }

      const route = data.routes[0];
      const distance = (route.distanceMeters / 1000).toFixed(1);
      const minutes = Math.round(parseFloat(route.duration) / 60);
      const fare = route.travelAdvisory?.transitFare;

      if (method === 'train' && fare?.units != null) {
        $('tf-fare').value = Number(fare.units);
        updateCost();
        result.textContent =
          `距離：約${distance} km、所要時間：約${minutes}分。` +
          `推定運賃：${fare.currencyCode || '通貨不明'} ${fare.units}` +
          `${fare.nanos ? '（小数部分あり）' : ''}`;
      } else {
        result.textContent =
          `距離：約${distance} km、所要時間：約${minutes}分。` +
          '運賃は取得できなかったため、下の欄に入力してください。';
      }
    } catch (error) {
      console.error('ルート検索エラー:', error);
      result.textContent =
        '検索失敗：APIキー、Routes APIの有効化、キー制限を確認してください。';
    } finally {
      $('tf-route-search').disabled = false;
    }
  };

  $('tf-cancel').onclick = () => root.innerHTML = '';

  $('modal-overlay').addEventListener('click', e => {
    if (e.target.id === 'modal-overlay') root.innerHTML = '';
  });

  $('tf-save').onclick = () => {
    try {
      const title = $('tf-title').value.trim();
      const departure = $('tf-departure').value.trim();
      const destination = $('tf-destination').value.trim();
      const startDate = $('tf-start').value;
      const endDate = $('tf-end').value;
      const fareText = $('tf-fare').value;
      const peopleText = $('tf-people').value;
      const budgetText = $('tf-budget').value;

      const fare = Number(fareText);
      const people = Number(peopleText);
      const budget = Number(budgetText);

      if (!title || !departure || !destination || !startDate || !endDate) {
        showToast('必須項目をすべて入力してください');
        return;
      }
      if (endDate < startDate) {
        showToast('終了日は開始日以降にしてください');
        return;
      }
      if (fareText.trim() === '' || !Number.isFinite(fare) || fare < 0) {
        showToast('片道料金を0以上の数値で入力してください');
        return;
      }
      if (peopleText.trim() === '' ||
          !Number.isInteger(people) || people < 1 || people > 100) {
        showToast('人数は1〜100人の整数で入力してください');
        return;
      }
      if (budgetText.trim() !== '' &&
          (!Number.isFinite(budget) || budget < 0)) {
        showToast('予算上限は0以上の数値で入力してください');
        return;
      }

      const transport = {
        method: $('tf-method').value,
        oneWayFare: fare,
        people,
        roundTripTotal: fare * 2 * ($('tf-method').value === 'car' ? 1 : people),
        perPersonRoundTrip: fare * 2 / ($('tf-method').value === 'car' ? people : 1)
      };

      if (trip) {
        Object.assign(trip, {
          title, departure, destination, startDate, endDate,
          transport,
          budgetPerPerson: budgetText.trim() === '' ? 0 : budget
        });
        // 作成・編集画面の交通手段と運賃を見積もり画面にも反映する。
        delete trip.transportCalc;
        trip.estimate = trip.estimate || {};
        trip.estimate.transport = transport.roundTripTotal;
      } else {
        state.trips.unshift({
          id: uid('trip'),
          title, departure, destination, startDate, endDate,
          transport,
          budgetPerPerson: budgetText.trim() === '' ? 0 : budget,
          roundingUnit: 1,
          roundingMethod: 'random',
          members: [{
            id: state.currentUserId,
            name: state.profile.name,
            owner: true,
            drink: !!state.profile.drink      // 追加: プロフィールの「飲酒」を引き継ぐ（分担ルールの「飲酒する人のみ」に使う）
          }],
          estimate: {
            transport: transport.roundTripTotal,
            lodging: 0,
            food: 0,
            sightseeing: 0,
            souvenir: 0,
            other: 0
          },
          expenses: [],
          settlements: [],
          notifications: {
            settlement: true,
            reminder: true,
            deadline: true
          }
        });
      }

      saveState();
      root.innerHTML = '';
      render();
      showToast('保存しました');
    } catch (error) {
      console.error('旅行の保存に失敗しました:', error);
      showToast('保存に失敗しました。画面を再読み込みして、もう一度お試しください');
    }
  };
}


/* ---- 起動処理 ---- */
(async function boot() {
  await loadState();
  const params = new URLSearchParams(location.search);

  if (params.get('edit') === 'profile') {
    view = 'onboarding';
  } else {
    view = state.profile ? 'tripList' : 'onboarding';
  }

  render();

  // 追加: クラウド同期の開始（メールのリンクから戻ってきた場合のログイン完了・ログイン状態の復元）
  if (typeof Cloud !== 'undefined') {
    Cloud.start(() => {
      const editing = new URLSearchParams(location.search).get('edit') === 'profile';
      if (view === 'onboarding' && state.profile && !editing) { view = 'tripList'; render(); return; }   // 同期でプロフィールが届いた
      if (view === 'tripList') { render(); return; }
      const slot = document.getElementById('cloud-slot');                  // 入力中の画面を消さないよう、カードだけ差し替える
      if (slot) { slot.innerHTML = Cloud.renderCard(); Cloud.bindCard(); }
    });
  }
})();
</script>
</body>
</html>
