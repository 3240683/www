<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>旅費メモ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>

<script src="common.js"></script>
<script>
/* =========================================================
   index.html: プロフィール登録（3.1） / 旅行一覧（3.2） / 旅行作成（3.3・モーダル）
========================================================= */
let view = 'onboarding'; // 'onboarding' | 'tripList'

function render(){
  const app = document.getElementById('app');
  if(view === 'onboarding'){ app.innerHTML = topbar(false) + renderOnboarding(); bindOnboarding(); return; }
  if(view === 'tripList'){ app.innerHTML = topbar(true) + renderTripList(); bindTripList(); return; }
}

/* ---- 3.1 初期登録画面 ---- */
function renderOnboarding(){
  const p = state.profile || { name:'', age:'', license:false, drink:false, smoke:false };
  return `
  <main>
    <div class="card" style="max-width:480px;margin:20px auto;">
      <div class="section-title"><h2>プロフィール登録</h2></div>
      <p class="muted">旅費メモを使い始めるために、あなたの情報を登録してください。</p>
      <div class="field">
        <label>氏名 <span style="color:var(--accent)">*</span></label>
        <input type="text" id="f-name" value="${escapeHtml(p.name)}" placeholder="例）山田 太郎">
      </div>
      <div class="field">
        <label>年齢 <span style="color:var(--accent)">*</span></label>
        <input type="number" id="f-age" min="0" value="${p.age||''}" placeholder="例）28">
      </div>
      ${toggleRow('f-license','運転免許', '交通手段の提案に利用します', p.license)}
      ${toggleRow('f-drink','飲酒', 'お店選びの参考にします', p.drink)}
      ${toggleRow('f-smoke','喫煙', '宿泊先の提案に利用します', p.smoke)}
      <div class="btn-row">
        <button class="btn accent" id="btn-save-profile">登録</button>
        ${state.profile ? '<button class="btn secondary" id="btn-cancel-profile">キャンセル</button>' : ''}
      </div>
    </div>
  </main>`;
}
function bindOnboarding(){
  document.getElementById('btn-save-profile').onclick = ()=>{
    const name = document.getElementById('f-name').value.trim();
    const age = document.getElementById('f-age').value;
    if(!name || !age){ showToast('氏名と年齢を入力してください'); return; }
    state.profile = {
      name, age: Number(age),
      license: document.getElementById('f-license').checked,
      drink: document.getElementById('f-drink').checked,
      smoke: document.getElementById('f-smoke').checked,
    };
    saveState();
    view = 'tripList';
    render();
    showToast('登録しました');
  };
  const cancelBtn = document.getElementById('btn-cancel-profile');
  if(cancelBtn) cancelBtn.onclick = ()=>{ view = 'tripList'; render(); };
}

/* ---- 3.2 旅行一覧画面 ---- */
function renderTripList(){
  const rows = state.trips.map(t=>{
    const st = tripStatusLabel(t);
    return `
    <div class="trip-card" data-id="${t.id}">
      <div>
        <div style="font-weight:700; font-size:15.5px;">${escapeHtml(t.title)}</div>
        <div class="route">${escapeHtml(t.departure)} → ${escapeHtml(t.destination)}</div>
        <div class="dates">${t.startDate||'?'} 〜 ${t.endDate||'?'}</div>
      </div>
      <div style="display:flex;align-items:center;gap:10px;">
        <span class="status-pill ${st.done?'done':''}">${st.text}</span>
        <button class="icon-btn btn-edit-trip" data-id="${t.id}" title="編集">✎</button>
        <button class="icon-btn btn-delete-trip" data-id="${t.id}" title="削除">🗑</button>
      </div>
    </div>`;
  }).join('');

  return `
  <main>
    <div class="trip-list-header">
      <h2 style="margin:0;">旅行一覧</h2>
      <button class="btn accent" id="btn-new-trip">＋ 新規作成</button>
    </div>
    ${state.trips.length ? rows : `
      <div class="empty-state">
        <h3>まだ旅行がありません</h3>
        <p>「新規作成」から最初の旅行を登録しましょう。</p>
      </div>`}
  </main>
  ${modalHost()}`;
}
function bindTripList(){
  document.getElementById('btn-new-trip').onclick = ()=> openTripFormModal(null);
  // プロフィール編集は通常のリンク(index.html?edit=profile)なのでJSでのbindは不要

  document.querySelectorAll('.trip-card').forEach(el=>{
    el.addEventListener('click', (e)=>{
      if(e.target.closest('.btn-edit-trip') || e.target.closest('.btn-delete-trip')) return;
      state.currentTripId = el.dataset.id;
      saveState();
      location.href = 'estimate.html?trip=' + el.dataset.id;
    });
  });
  document.querySelectorAll('.btn-edit-trip').forEach(el=>{
    el.onclick = (e)=>{ e.stopPropagation(); openTripFormModal(el.dataset.id); };
  });
  document.querySelectorAll('.btn-delete-trip').forEach(el=>{
    el.onclick = (e)=>{
      e.stopPropagation();
      if(confirm('この旅行を削除しますか？')){
        state.trips = state.trips.filter(t=>t.id!==el.dataset.id);
        saveState(); render(); showToast('削除しました');
      }
    };
  });
}

/* ---- 3.3 旅行作成画面（モーダル） ---- */
function openTripFormModal(tripId){
  const trip = tripId ? findTrip(tripId) : null;
  const root = document.getElementById('modal-root');
  root.innerHTML = `
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal">
      <h2>${trip? '旅行を編集' : '旅行を作成'}</h2>
      <div class="field"><label>旅行名 *</label><input type="text" id="tf-title" value="${trip?escapeHtml(trip.title):''}" placeholder="例）春の京都旅行"></div>
      <div class="grid2">
        <div class="field"><label>出発地 *</label><input type="text" id="tf-departure" value="${trip?escapeHtml(trip.departure):''}" placeholder="例）東京駅"></div>
        <div class="field"><label>目的地 *</label><input type="text" id="tf-destination" value="${trip?escapeHtml(trip.destination):''}" placeholder="例）京都駅"></div>
      </div>
      <div class="grid2">
        <div class="field"><label>開始日 *</label><input type="date" id="tf-start" value="${trip?trip.startDate:''}"></div>
        <div class="field"><label>終了日 *</label><input type="date" id="tf-end" value="${trip?trip.endDate:''}"></div>
      </div>
      <div class="btn-row">
        <button class="btn accent" id="tf-save">保存</button>
        <button class="btn secondary" id="tf-cancel">キャンセル</button>
      </div>
    </div>
  </div>`;
  document.getElementById('tf-cancel').onclick = ()=> root.innerHTML='';
  document.getElementById('modal-overlay').addEventListener('click', (e)=>{ if(e.target.id==='modal-overlay') root.innerHTML=''; });
  document.getElementById('tf-save').onclick = ()=>{
    const title = document.getElementById('tf-title').value.trim();
    const departure = document.getElementById('tf-departure').value.trim();
    const destination = document.getElementById('tf-destination').value.trim();
    const startDate = document.getElementById('tf-start').value;
    const endDate = document.getElementById('tf-end').value;
    if(!title || !departure || !destination || !startDate || !endDate){
      showToast('すべての項目を入力してください'); return;
    }
    if(trip){
      Object.assign(trip, { title, departure, destination, startDate, endDate });
    } else {
      state.trips.unshift({
        id: uid('trip'), title, departure, destination, startDate, endDate,
        roundingUnit: 1, roundingMethod: 'random',
        members: [{ id: state.currentUserId, name: state.profile.name, owner:true }],
        estimate: { transport:0, lodging:0, food:0, sightseeing:0, souvenir:0, other:0 },
        expenses: [],
        settlements: [],
        notifications: { settlement:true, reminder:true, deadline:true }
      });
    }
    root.innerHTML = '';
    saveState(); render();
    showToast('保存しました');
  };
}

/* ---- 起動処理 ---- */
(async function boot(){
  await loadState();
  const params = new URLSearchParams(location.search);
  if(params.get('edit') === 'profile'){
    view = 'onboarding';
  } else {
    view = state.profile ? 'tripList' : 'onboarding';
  }
  render();
})();
</script>
</body>
</html>
