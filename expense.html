<script>
/* =========================================================
   expense.html: 3.5 実費登録画面（オフラインOCR／行選択機能つき）
========================================================= */
/* ▼▼▼ 変更: カメラ撮影とレシート画像の保存（ここから） ▼▼▼ */
// 保存したレシート画像はブラウザ内のIndexedDBに入れる（localStorageは約5MBまでで画像には足りないため）。
// 旅行データ側には画像のID（receiptId）だけを持たせる。外部には送信されない。
const RCP_DB = 'tabihimemo-receipts', RCP_STORE = 'receipts';
function idbOpen(){
  return new Promise((resolve, reject)=>{
    const req = indexedDB.open(RCP_DB, 1);
    req.onupgradeneeded = ()=> req.result.createObjectStore(RCP_STORE);
    req.onsuccess = ()=> resolve(req.result);
    req.onerror = ()=> reject(req.error);
  });
}
async function idbRun(mode, fn){
  const db = await idbOpen();
  return new Promise((resolve, reject)=>{
    const tx = db.transaction(RCP_STORE, mode);
    const req = fn(tx.objectStore(RCP_STORE));
    tx.oncomplete = ()=>{ db.close(); resolve(req ? req.result : undefined); };
    tx.onerror = tx.onabort = ()=>{ db.close(); reject(tx.error); };
  });
}
const idbPut    = (id, blob)=> idbRun('readwrite', st=> st.put(blob, id));
const idbGet    = (id)=>       idbRun('readonly',  st=> st.get(id));
const idbDelete = (id)=>       idbRun('readwrite', st=> st.delete(id));
const idbKeys   = ()=>         idbRun('readonly',  st=> st.getAllKeys());

let pendingReceipt = null;      // 撮影／選択したばかりで、まだ保存していない画像（メモリ上のみ。ページを離れると消える）
let objectUrls = [];            // 画面表示用に作ったURL（再描画のたびに解放する）
function makeUrl(blob){ const u = URL.createObjectURL(blob); objectUrls.push(u); return u; }
function revokeObjectUrls(){ objectUrls.forEach(u=> { try{ URL.revokeObjectURL(u); }catch(e){} }); objectUrls = []; }

// 保存用に縮小（長辺1600px・JPEG）。1枚あたり約300KB。失敗したら元の画像をそのまま使う
async function compressForStorage(file){
  try{
    let bmp;
    try{ bmp = await createImageBitmap(file, { imageOrientation: 'from-image' }); }
    catch(e){ bmp = await createImageBitmap(file); }
    const scale = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
    const canvas = document.createElement('canvas');
    canvas.width = Math.round(bmp.width * scale); canvas.height = Math.round(bmp.height * scale);
    canvas.getContext('2d').drawImage(bmp, 0, 0, canvas.width, canvas.height);
    return await new Promise(res=> canvas.toBlob(b=> res(b || file), 'image/jpeg', 0.75));
  }catch(e){
    console.warn('画像の縮小に失敗したため元の画像を使います', e);
    return file;
  }
}

// どの旅行にも使われていない画像（記録や旅行を削除した後に残ったもの）を片付ける。ページを開いたとき1回だけ
let receiptGcDone = false;
async function gcReceipts(){
  if(receiptGcDone || !state.trips.length) return;     // 旅行データが空のときは誤って消さないよう何もしない
  receiptGcDone = true;
  try{
    const used = new Set();
    state.trips.forEach(t=> (t.expenses||[]).forEach(e=>{ if(e.receiptId) used.add(e.receiptId); }));
    for(const k of await idbKeys()){ if(!used.has(k)) await idbDelete(k); }
  }catch(e){ console.warn('画像の整理に失敗しました', e); }
}

const IS_MOBILE = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) ||
                  (/Macintosh/.test(navigator.userAgent) && navigator.maxTouchPoints > 1);

// PC向け: ブラウザのカメラ画面（Webカメラ）で撮影する。撮影したらカメラはすぐ停止する
async function openCameraModal(onCapture){
  const root = document.getElementById('modal-root');
  let stream;
  try{
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 3840 }, height: { ideal: 2160 } }, audio: false
    });
  }catch(e){
    showToast(e && e.name === 'NotAllowedError'
      ? 'カメラの使用が許可されていません。ブラウザのアドレスバーの設定から許可してください'
      : 'カメラを起動できませんでした。「画像ファイルから読み取る」を使ってください');
    return;
  }
  root.innerHTML = `
  <div class="modal-overlay" id="cam-overlay">
    <div class="modal camera-box" style="max-width:720px;">
      <h2>レシートを撮影</h2>
      <p class="muted">レシートが画面いっぱいに写るようにして「撮影」を押してください。</p>
      <video id="cam-video" autoplay playsinline muted></video>
      <div class="btn-row">
        <button class="btn accent" id="cam-shot">撮影して読み取る</button>
        <button class="btn secondary" id="cam-cancel">キャンセル</button>
      </div>
    </div>
  </div>`;
  const video = document.getElementById('cam-video');
  video.srcObject = stream;
  const close = ()=>{ stream.getTracks().forEach(t=> t.stop()); root.innerHTML = ''; };
  document.getElementById('cam-cancel').onclick = close;
  document.getElementById('cam-overlay').addEventListener('click', (e)=>{ if(e.target.id === 'cam-overlay') close(); });
  document.getElementById('cam-shot').onclick = ()=>{
    if(!video.videoWidth){ showToast('カメラの準備中です。少し待ってからもう一度押してください'); return; }
    const canvas = document.createElement('canvas');
    canvas.width = video.videoWidth; canvas.height = video.videoHeight;
    canvas.getContext('2d').drawImage(video, 0, 0);
    canvas.toBlob(b=>{
      close();
      if(b) onCapture(new File([b], 'receipt.jpg', { type: 'image/jpeg' }));
    }, 'image/jpeg', 0.92);
  };
}

// 保存済みレシート画像の表示（拡大・ダウンロード・削除）
async function openReceiptViewer(exp, onDeleted){
  let blob = null;
  try{ blob = await idbGet(exp.receiptId); }catch(e){}
  if(!blob){ showToast('画像が見つかりません（別の端末やブラウザで保存した記録かもしれません）'); return; }
  const url = makeUrl(blob);
  const root = document.getElementById('modal-root');
  root.innerHTML = `
  <div class="modal-overlay" id="rv-overlay">
    <div class="modal" style="max-width:640px;text-align:center;">
      <img src="${url}" alt="レシート画像" style="max-width:100%;max-height:70vh;border:1px solid var(--line);">
      <div class="btn-row" style="justify-content:center;">
        <a class="btn secondary" href="${url}" download="receipt_${exp.date||'image'}.jpg">ダウンロード</a>
        <button class="btn ghost" id="rv-delete">画像を削除</button>
        <button class="btn secondary" id="rv-close">閉じる</button>
      </div>
    </div>
  </div>`;
  document.getElementById('rv-close').onclick = ()=>{ root.innerHTML = ''; };
  document.getElementById('rv-overlay').addEventListener('click', (e)=>{ if(e.target.id === 'rv-overlay') root.innerHTML = ''; });
  document.getElementById('rv-delete').onclick = ()=> confirmDeleteReceipt(exp, onDeleted);
}
function confirmDeleteReceipt(exp, onDeleted){
  openYesNoModal('このレシート画像を削除しますか？（記録そのものは残ります）', async ()=>{
    try{ await idbDelete(exp.receiptId); }catch(e){}
    delete exp.receiptId;
    if(onDeleted) onDeleted(); else rerenderPage();
    showToast('レシート画像を削除しました');
  });
}
/* ▲▲▲ 変更: カメラ撮影とレシート画像の保存（ここまで） ▲▲▲ */

// 変更: 支払日の既定値は「読み込んだ日（今日）」。端末の現地時間で YYYY-MM-DD にする
function todayStr(){
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

/* ▼▼▼ 変更: 保存済みの実費を編集できるようにする（ここから） ▼▼▼ */
let editingId = null;   // 編集中の実費ID（nullなら新規追加モード）

      <td>${ex.date||'-'}</td>
      <td class="muted">${escapeHtml(ex.memo||'')}</td>
      <td style="white-space:nowrap;">
        ${ex.receiptId ? `<button class="icon-btn btn-view-receipt" data-id="${ex.id}" title="レシート画像を見る">🧾</button>` : ''}
        <button class="icon-btn btn-edit-expense" data-id="${ex.id}" title="編集">✎</button>

  const memberOptions = trip.members.map(m=>`<option value="${m.id}" ${m.id===ev.payer?'selected':''}>${escapeHtml(m.name)}</option>`).join('');
  const catOptions = ESTIMATE_CATEGORIES.map(([k,l])=>`<option value="${k}" ${k===ev.category?'selected':''}>${l}</option>`).join('');

  return `
  <div class="card">

    <button type="button" class="btn accent camera-hero" id="btn-camera">📷 カメラで撮影して読み取る</button>
    <div class="ocr-sub">
      <button type="button" class="btn ghost sm" id="btn-pick-file">画像ファイルから読み取る</button>
      <span>金額と日付を自動で入力します。撮影した画像は読み取りにだけ使い、初期設定では保存されません。</span>
    </div>

    <input type="file" id="ocr-camera" accept="image/*" capture="environment" hidden>
    <div id="ocr-status" class="muted" style="margin-top:10px;"></div>
    <div id="receipt-preview"></div>
    <div id="ocr-lines" style="margin:10px 0 18px;"></div>
    <div class="grid3">
      <div class="field"><label>費目</label><select id="ex-category">${catOptions}</select></div>
      <div class="field"><label>金額 <span style="color:var(--accent)">*</span></label><input type="text" inputmode="numeric" id="ex-amount" placeholder="円" value="${ev.actual ? Number(ev.actual).toLocaleString('ja-JP') : ''}" oninput="formatMoneyInput(this)"></div>
      <div class="field"><label>支払者</label><select id="ex-payer">${memberOptions}</select>
        <div class="pay-hint">参加者の追加は<a href="invite.html?trip=${trip.id}">招待ページ</a>で行えます</div></div>
    </div>
    <div class="grid2">
      <div class="field"><label>支払日 <span style="color:var(--accent)">*</span></label><input type="date" id="ex-date" value="${ev.date||''}"></div>
      <div class="field"><label>メモ</label><input type="text" id="ex-memo" placeholder="任意" value="${escapeHtml(ev.memo||'')}"></div>
    </div>
    ${editing && editing.receiptId ? `
    <div class="field">
      <label>保存済みのレシート画像</label>
      <div class="receipt-saved">
        <img class="receipt-thumb-img" id="saved-receipt-img" alt="レシート画像（クリックで拡大）">
        <button type="button" class="btn ghost sm" id="btn-del-receipt">この画像を削除</button>
      </div>
    </div>` : ''}
    <div class="sticky-actions">
      <button class="btn accent" id="btn-add-expense">${editing ? '変更を保存' : '実費を追加'}</button>
      ${editing ? '<button class="btn secondary" id="btn-cancel-edit">キャンセル</button>' : ''}
    </div>
  </div>
  <div class="card">
    <div class="section-title"><h2>記録一覧</h2>${trip.expenses.length ? '<span class="muted">✎ で内容を修正できます</span>' : ''}</div>
    ${trip.expenses.length ? `
    <table class="data-table">
      <thead><tr><th>費目</th><th>金額</th><th>支払者</th><th>支払日</th><th>メモ</th><th></th></tr></thead>
      <tbody>${rows}</tbody>

  </div>`;
}

/* ===BEGIN-EXTRACT=== 変更: 金額・日付の候補抽出ロジック（ここから） */
// ---- 前処理: 全角→半角、日本語の文字間に入る空白の除去（「合 計」→「合計」） ----
function cleanLine(l){
  return String(l||'').normalize('NFKC')
    .replace(/(?<=[\u3040-\u30ff\u4e00-\u9fff])\s+(?=[\u3040-\u30ff\u4e00-\u9fff])/g, '')
    .trim();
}
// 数字まわりの誤読を直す（O/Q/D→0、I/l/|→1）
function fixDigitMisreads(l){
  return l
    .replace(/(?<=\d)[OoQD]/g, '0').replace(/[OoQD](?=\d)/g, '0')
    .replace(/(?<=\d)[Il|]|[Il|](?=\d{2})/g, '1')
    // 桁区切りの前後に入った空白を詰める（「1. 400」→「1.400」「¥1, 400」→「¥1,400」）
    .replace(/(?<=\d)\s*([,.])\s*(?=\d{3}(?!\d))/g, '$1');
}

const RE_PLUS  = /合計|お買上|ご請求|請求額|領収金額|総計|TOTAL|Total|(?<![小少会])計/;
const RE_SUB   = /[小少]計/;
const RE_MINUS_STRICT = /預|釣/;
const RE_MINUS = /預|釣|現金|ポイント|対象|税|軽減|割引|クーポン|TEL|Tel|電話|登録|番号|No\.?|ID/;
const RE_PHONE = /\d{2,4}-\d{2,4}-\d{3,4}/;

// ---- 日付: 2026/09/25・2026年9月25日・26.09.25・令和8年9月25日、「/」が「7」などに誤読された 2026709/25 にも対応 ----
// 変更: 年が印字されていない日付（「3月22日」「3/22(金) 11:32」「20XX年3月22日」）は、月日だけ拾って年を推定する
let OCR_CTX = null;   // {tripStart, tripEnd}: 年の推定に使う旅行期間（runReceiptOcrOffline が設定）

function inferYear(mo, d, ctx, weekday){
  const today = new Date();
  const mk = y => new Date(y, mo-1, d);
  // 日付として存在し、曜日（分かる場合）も合う年だけを候補にする
  const ok = y => { const t = mk(y); return t.getMonth() === mo-1 && t.getDate() === d && (weekday < 0 || t.getDay() === weekday); };
  // 旅行期間が分かっていれば、その前後30日以内に収まる年を優先
  if(ctx && ctx.tripStart && ctx.tripEnd){
    const st = new Date(ctx.tripStart + 'T00:00:00'), en = new Date(ctx.tripEnd + 'T00:00:00');
    if(!isNaN(st) && !isNaN(en)){
      const lo = st.getTime() - 30*864e5, hi = en.getTime() + 30*864e5;
      for(const y of [st.getFullYear(), en.getFullYear()]){
        if(ok(y) && mk(y).getTime() >= lo && mk(y).getTime() <= hi) return y;
      }
    }
  }
  // それ以外は「今日以前で最も新しい日付」になる年（曜日が分かる場合は、曜日が合う年。レシートは過去〜今日の日付のため）
  const ty = today.getFullYear();
  for(let y = ty; y >= ty - 8; y--){
    if(ok(y) && mk(y).getTime() <= today.getTime() + 864e5) return y;
  }
  return null;
}

function findDates(rawLine){
  const line = fixDigitMisreads(cleanLine(rawLine));
  const hasTime = /\d{1,2}\s*:\s*\d{2}/.test(line);
  const wdm = line.match(/[（(]\s*([日月火水木金土])\s*[)）]/);
  const hasWeekday = !!wdm;
  const weekday = wdm ? '日月火水木金土'.indexOf(wdm[1]) : -1;      // 印字された曜日（日=0 … 土=6）。無ければ -1
  const out = [];
  const pad = n => String(n).padStart(2,'0');
  const valid = (y,mo,d)=> mo>=1 && mo<=12 && d>=1 && d<=31 && y>=2000 && y<=2100;
  const push = (y,mo,d,score,inferred)=>{
    if(!valid(y,mo,d)) return;
    // 読み取った日付が、印字された曜日と合うかで検証する（OCRの読み間違いで日付が1桁ずれた場合に気づける）
    let wd = '';
    if(weekday >= 0 && inferred) wd = 'match';       // 年を推定した日付は、曜日が合う年を選んでいる
    if(weekday >= 0 && !inferred){
      wd = (new Date(y, mo-1, d).getDay() === weekday) ? 'match' : 'mismatch';
      score += wd === 'match' ? 3 : -3;
    }
    out.push({ value: `${y}-${pad(mo)}-${pad(d)}`, score: score + (hasTime ? 2 : 0), inferred: !!inferred, wd });
  };
  let m;
  const re1 = /(?<!\d)(20\d{2}|\d{2})\s*[\/\-.年]\s*(\d{1,2})\s*[\/\-.月]\s*(\d{1,2})/g;
  while((m = re1.exec(line))){
    let y = Number(m[1]);
    if(m[1].length === 4) push(y, Number(m[2]), Number(m[3]), 3);
    else if(y >= 20 && y <= 39) push(2000 + y, Number(m[2]), Number(m[3]), 1);   // 2桁年は20〜39のみ
  }
  const re2 = /(?:令和|R)\s*(\d{1,2})\s*[年.\/\-]\s*(\d{1,2})\s*[月.\/\-]\s*(\d{1,2})/g;
  while((m = re2.exec(line))) push(2018 + Number(m[1]), Number(m[2]), Number(m[3]), 3);
  const re3 = /(20\d{2})[^\d\s]{0,2}[71lI|]?\s*(0[1-9]|1[0-2])\s*[\/\-.月7]?\s*(0[1-9]|[12]\d|3[01])/g;
  while((m = re3.exec(line))) push(Number(m[1]), Number(m[2]), Number(m[3]), 1);

  // 年が読めない／印字されていない日付（上の形式で見つからなかった行だけ）
  if(!out.length){
    const addMD = (mo, d, score)=>{
      if(mo < 1 || mo > 12 || d < 1 || d > 31) return;
      const y = inferYear(mo, d, OCR_CTX, weekday);
      if(y) push(y, mo, d, score, true);
    };
    const re4 = /(?<!\d)(\d{1,2})\s*月\s*(\d{1,2})\s*日/g;                 // 3月22日
    while((m = re4.exec(line))) addMD(Number(m[1]), Number(m[2]), hasWeekday ? 2 : 1);
    if(!out.length && (hasTime || hasWeekday)){                              // 3/22(金) 11:32 （時刻か曜日が同じ行にある場合のみ）
      const re5 = /(?<![\d\/.])(\d{1,2})\s*[\/.]\s*(\d{1,2})(?![\d\/.])/g;
      while((m = re5.exec(line))) addMD(Number(m[1]), Number(m[2]), 1);
    }
  }
  return out;
}
function extractDateCandidates(rawLines){
  const best = new Map();
  rawLines.forEach(raw=> findDates(raw).forEach(d=>{
    const cur = best.get(d.value);
    if(!cur || cur.score < d.score) best.set(d.value, d);
  }));
  return [...best.values()].sort((a,b)=> b.score - a.score).slice(0, 3);
}

// ---- 金額: 1行から数字トークンを取り出す（単価@420・数量2点・電話番号・日付行は除外） ----
function amountTokens(rawLine){
  const line = fixDigitMisreads(cleanLine(rawLine));
  const tokens = [];
  if(findDates(rawLine).length || /\d{1,2}\s*:\s*\d{2}/.test(line) || RE_PHONE.test(line)) return { line, tokens };
  const re = /(?<!\d)([¥\\]|Y)?\s*(\d{1,3}(?:[,.]\d{3})+|\d{1,7})(?!\d)\s*(円)?/g;
  let m;
  while((m = re.exec(line))){
    const before = line.slice(0, m.index).slice(-1);
    const after  = line.slice(re.lastIndex);
    const charBefore2 = line.slice(0, m.index).slice(-2, -1);
    if(before === '@') continue;                                              // 単価（@420）は除外
    if((before === '-' && /\d/.test(charBefore2)) || /^\s*-\s*\d/.test(after)) continue;   // 数字ではさまれた「-」（6-80-21）は除外
    const trailingDash = /^\s*[-ー―‐−]\s*$/.test(after);                      // 行末の「-」は金額の印（¥1,400-）
    if(/^\s*[点個枚番号%]/.test(after)) continue;
    const value = parseInt(m[2].replace(/[,.]/g,''), 10);
    if(!(value >= 1 && value <= 9999999)) continue;
    tokens.push({ value, hasYen: !!(m[1] || m[3]), hasComma: /[,.]/.test(m[2]), trailingDash });
  }
  return { line, tokens };
}
function lineFlags(line){
  const hasPlus = RE_PLUS.test(line);
  // 「N点」があり、商品名らしい日本語が（ほとんど）無い行は、合計／小計の行（例: 「合計/ 23点 ¥1,400」が「atl/ 23 点 ¥1.400」と崩れた場合）
  const rest = line.replace(/[\d\s,.¥\\\/:()（）\-]/g, '').replace(/[点計合小総]/g, '');
  const totalLike = /\d+\s*点/.test(line) && (rest.match(/[\u3040-\u30ff\u4e00-\u9fff]/g) || []).length <= 1;
  return {
    hasPlus,
    hasSub: !hasPlus && RE_SUB.test(line),
    totalLike,
    minus: hasPlus ? RE_MINUS_STRICT.test(line) : RE_MINUS.test(line)
  };
}

// 金額候補:
//  ・「合計」行／¥や円が付いた数字を高く評価、お預り・お釣り・税の行は減点
//  ・同じ金額が複数行に出てくるほど加点（レシートは合計が小計・対象額などで繰り返し出る）
//  ・「お預り − お釣り ＝ 合計」が成り立つ組み合わせを見つけたら、その合計に加点し、お預り・お釣りは候補から外す
//  ・合計の約6.5〜9.5%（内税の目安）にあたる金額は消費税とみなして外す
function extractAmountCandidates(rawLines){
  const map = new Map();
  rawLines.forEach(raw=>{
    const { line, tokens } = amountTokens(raw);
    if(!tokens.length) return;
    const f = lineFlags(line);
    tokens.forEach(t=>{
      let s = 0;
      if(t.hasYen) s += 4;
      if(t.hasComma) s += 1;
      if(f.hasPlus) s += 10; else if(f.hasSub) s += 3; else if(f.totalLike && !f.minus) s += 6;
      if(t.trailingDash) s += 6;       // 領収証の金額欄「¥1,400-」のように、行末に「-」が付く金額は合計の可能性が高い
      if(f.minus) s -= 8;
      if(!t.hasYen && !t.hasComma && String(t.value).length <= 2) s -= 12;
      let e = map.get(t.value);
      if(!e){ e = { value:t.value, score:s, count:0, solid:false, tag:'', flag:false, tax:false }; map.set(t.value, e); }
      e.count++;
      e.score = Math.max(e.score, s);
      if(t.hasYen || t.hasComma) e.solid = true;
      if(f.hasPlus || (f.totalLike && !f.hasSub && !f.minus)) e.tag = '合計'; else if(f.hasSub && !e.tag) e.tag = '小計';
    });
  });
  const arr = [...map.values()];
  arr.forEach(c=>{ c.score += Math.min(3, c.count - 1) * 2; });

  // お預り − お釣り ＝ 合計
  const solid = arr.filter(c=> c.solid);
  let best = null;
  solid.forEach(a=> solid.forEach(b=>{
    if(a.value <= b.value) return;
    const c = arr.find(x=> x.value === a.value - b.value);
    if(!c || c === a || c === b) return;
    if(!(c.score > a.score && c.score > b.score)) return;
    if(c.tag !== '合計' && c.tag !== '小計') return;     // 合計／小計の根拠が無い数字は、偶然の引き算の一致で昇格させない
    if(!best || c.score > best.c.score) best = { a, b, c };
  }));
  if(best){ best.c.score += 8; best.c.tag = '合計'; best.a.flag = true; best.b.flag = true; }

  // 消費税っぽい金額
  arr.forEach(t=>{
    if(arr.some(c=> c.value > t.value && c.score > 0 && t.value / c.value >= 0.065 && t.value / c.value <= 0.095)){
      t.score -= 6; t.tax = true;
    }
  });

  const sorted = arr.filter(c=> !c.flag).sort((a,b)=> b.score - a.score);
  const strong = sorted.filter(c=> c.score > 0 && !c.tax);
  const topScore = strong.length ? strong[0].score : 0;
  let shown = strong.filter(c=> c.score >= topScore * 0.3);   // 1位の3割未満のスコアは誤読ノイズとして非表示
  // 1位が「合計」と確定しているときは、合計／小計のラベルが付いた候補だけを残す（商品の単価などを出さない）
  if(shown.length && shown[0].tag === '合計') shown = shown.filter(c=> c.tag === '合計' || c.tag === '小計');
  return (shown.length ? shown : sorted.slice(0, 2)).slice(0, 3)
    .map(c=> ({ value:c.value, score:c.score, label: c.tag || (c.count >= 2 ? '複数行に登場' : '') }));
}

// 店舗名の推定: 電話番号を除き、住所・営業時間・キャンペーン文言の行は避け、「…店」を優先
function guessStore(rawLines){
  const strip = l => l.replace(/^[^A-Za-z0-9\u3040-\u30ff\u4e00-\u9fff]+|[^A-Za-z0-9\u3040-\u30ff\u4e00-\u9fff)]+$/g, '').trim();
  const cands = rawLines.slice(0, 12).map(cleanLine)
    .map(l=> l.replace(/(TEL|Tel|電話|ＴＥＬ)\s*[\d\-]*|\d{2,4}-\d{2,4}-\d{3,4}/g, ' ').trim())
    .map(strip)
    .filter(l=> /[A-Za-z\u3040-\u30ff\u4e00-\u9fff]{3,}/.test(l))
    .filter(l=> !/領収|レシート|ご利用|ありがとう|営業|開催|セール|ポイント|支払|クレジット|\d{4,}/.test(l))
    .filter(l=> !/[都道府県].*[市区町村郡]|[市区町村郡].*\d+-\d+/.test(l));      // 住所らしい行は除外
  for(const l of cands){
    const tok = l.split(/\s+/).find(t=> /\S{2,}店$/.test(t));                  // 「みなとみらい店」のような語を優先
    if(tok) return tok;
  }
  return cands[0] || null;
}

// 「全行表示」用: 金額・日付に関係しそうな行だけに絞る（住所・電話・領収証・軽減税率などは除外）
function relevantLines(rawLines){
  const seen = new Set(), out = [];
  rawLines.forEach(raw=>{
    const l = cleanLine(raw);
    if(!l || seen.has(l)) return;
    const hasDate = findDates(raw).length > 0;
    const { line, tokens } = amountTokens(raw);
    const f = lineFlags(line);
    const keep = hasDate || tokens.some(t=> t.hasYen || t.hasComma) || f.hasPlus || f.hasSub;
    if(!keep) return;
    if(!hasDate && /税|軽減|対象|預|釣|登録|番号/.test(l)) return;
    seen.add(l); out.push(l);
  });
  return out;
}

// 1行から取り出す（「全行表示」のボタン用）
function extractAmountFromLine(line){
  const { tokens } = amountTokens(line);
  const t = tokens.find(x=> x.hasYen || x.hasComma) || tokens[tokens.length - 1];
  return t ? t.value : null;
}
function extractDateFromLine(line){
  const d = findDates(line).sort((a,b)=> b.score - a.score)[0];
  return d ? d.value : null;
}
function analyzeLines(lines, ctx){
  OCR_CTX = ctx || OCR_CTX;
  return {
    amounts: extractAmountCandidates(lines),
    dates: extractDateCandidates(lines),
    store: guessStore(lines),
    lines
  };
}
// 細長いレシート（縦横比が2.2倍超）は、上下に分割して読む。
// 全体を1回で読むと、下の方（合計・税額の行）が丸ごと読み飛ばされることがあるため。
// variant=1 のときは、別の分割位置（より細かく）で読み直す。
function planStrips(w, h, variant){
  const ratio = h / w;
  if(!(ratio > 2.2)) return null;
  const stripRatio = variant === 1 ? 1.0 : 1.5;            // 1ブロックの縦横比
  const n = Math.max(2, Math.ceil(ratio / stripRatio));
  const core = h / n, pad = core * 0.1;                    // 前後に1割ずつ重ねて、境目の行を読み落とさない
  const rects = [];
  for(let i = 0; i < n; i++){
    const y0 = Math.max(0, Math.round(i * core - pad));
    const y1 = Math.min(h, Math.round((i + 1) * core + pad));
    rects.push({ y: y0, h: y1 - y0 });
  }
  return { n, rects };
}
/* ===END-EXTRACT=== 変更: 金額・日付の候補抽出ロジック（ここまで） */

// 変更: 画像の前処理。縮小しすぎず（長辺3000px前後）、グレースケール化だけを行う。
// ※ コントラストの強制伸張は日付の「/」が「7」に化ける原因になったため行わない
function toGrayscale(ctx, w, h){
  const img = ctx.getImageData(0, 0, w, h), d = img.data;
  for(let i=0; i<d.length; i+=4){
    const g = Math.round(0.299*d[i] + 0.587*d[i+1] + 0.114*d[i+2]);
    d[i] = d[i+1] = d[i+2] = g;
  }
  ctx.putImageData(img, 0, 0);
}
async function decodeImage(file){
  try{ return await createImageBitmap(file, { imageOrientation: 'from-image' }); }
  catch(e){ return await createImageBitmap(file); }
}

// 読み取り用の画像（canvas）の配列を作る。
//  ・普通の画像: 1枚（長辺3000px前後）
//  ・細長いレシート: 上下に分割した複数枚（各ブロックの幅を1600〜2000pxにそろえる。小さい画像は拡大）
async function preprocessImages(file, maxSide, variant){
  try{
    const bmp = await decodeImage(file);
    const plan = planStrips(bmp.width, bmp.height, variant);
    if(!plan){
      const longSide = Math.max(bmp.width, bmp.height);
      let target = Math.min(longSide, maxSide);
      if(longSide < 2400) target = 2400;          // 小さい画像は拡大
      const scale = target / longSide;
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(bmp.width * scale); canvas.height = Math.round(bmp.height * scale);
      const ctx = canvas.getContext('2d');
      ctx.drawImage(bmp, 0, 0, canvas.width, canvas.height);
      toGrayscale(ctx, canvas.width, canvas.height);
      return [canvas];
    }
    const targetW = Math.min(2000, Math.max(1600, bmp.width));
    const scale = targetW / bmp.width;
    return plan.rects.map(r=>{
      const canvas = document.createElement('canvas');
      canvas.width = targetW; canvas.height = Math.round(r.h * scale);
      const ctx = canvas.getContext('2d');
      ctx.drawImage(bmp, 0, r.y, bmp.width, r.h, 0, 0, canvas.width, canvas.height);
      toGrayscale(ctx, canvas.width, canvas.height);
      return canvas;
    });
  }catch(e){
    console.warn('前処理に失敗したため元画像で読み取ります', e);
    return [file];
  }
}

// 変更: 1回目で金額・日付が十分に確からしければそのまま採用。
// 日付が無い／金額の確からしさが低い場合だけ、読み方を変えて2回目を読み取って結果を統合する。
// 細長いレシートは上下に分割して順に読み、境目で重なった行は重複を除く。
async function runReceiptOcrOffline(file, onStatus, ctx){
  let label = '読み取っています…';
  let partInfo = '';
  const worker = await Tesseract.createWorker('jpn+eng', 1, {
    logger: (m)=>{
      if(onStatus && m.status === 'recognizing text') onStatus(`${label}${partInfo}${Math.round((m.progress||0)*100)}%`);
    }
  });
  try{
    const pass = async (maxSide, variant)=>{
      const imgs = await preprocessImages(file, maxSide, variant);
      const lines = [];
      for(let i = 0; i < imgs.length; i++){
        partInfo = imgs.length > 1 ? `（${i+1}/${imgs.length}）` : '';
        const { data } = await worker.recognize(imgs[i]);
        const part = (data.text || '').split('\n').map(l=>l.trim()).filter(Boolean);
        const tail = new Set(lines.slice(-6).map(cleanLine));          // 前のブロックの末尾と同じ行（重なり部分）は省く
        part.forEach(l=>{ const c = cleanLine(l); if(!(c.length >= 4 && tail.has(c))) lines.push(l); });
      }
      return lines;
    };
    let lines = await pass(3000, 0);
    let result = analyzeLines(lines, ctx);
    const weak = !result.dates.length || !result.amounts.length || result.amounts[0].score < 12;
    if(weak){
      label = '精度を上げるため再読み取りしています…';
      lines = lines.concat(await pass(4000, 1));
      result = analyzeLines(lines, ctx);
    }
    return result;
  } finally {
    await worker.terminate();
  }
}

// 変更: 候補をチップで表示（崩れた生テキストではなく「合計」などのラベルを表示）。全行は折りたたみの中
function setSelected(container, kind, chip){

  chip.classList.add('selected');
}
function renderOcrCandidates(result){
  const box = document.getElementById('ocr-lines');

  const curDate = document.getElementById('ex-date').value;
  const today = todayStr();
  const amountChips = result.amounts.map(c=>`
    <button type="button" class="cand-chip ${c.value === curAmount ? 'selected' : ''}" data-kind="amount" data-value="${c.value}">
      ${yen(c.value)}${c.label ? `<span class="src">${escapeHtml(c.label)}</span>` : ''}
    </button>`).join('');
  // 日付: 「読み込んだ日（今日）」を先頭に常に出し、その後ろにレシートから読み取った候補を並べる
  const dateItems = [{ value: today, label: '読み込んだ日' }]
    .concat(result.dates.filter(c=> c.value !== today).map(c=> ({ value: c.value,
      label: c.inferred ? (c.wd === 'match' ? '年は曜日から推定' : '年は推定') : (c.wd === 'mismatch' ? '曜日が合いません' : (c.wd === 'match' ? 'レシートの日付（曜日一致）' : 'レシートの日付')) })));
  const dateChips = dateItems.map(c=>`
    <button type="button" class="cand-chip ${c.value === curDate ? 'selected' : ''}" data-kind="date" data-value="${c.value}">
      ${c.value.replace(/-/g,'/')}<span class="src">${c.label}</span>
    </button>`).join('');

  box.innerHTML = `
    <div class="cand-group">
      <div class="cand-title">金額の候補（正しいものをクリック）</div>
      <div class="cand-list">${amountChips || '<span class="muted">金額らしい数字が見つかりませんでした。手入力してください。</span>'}</div>
    </div>
    <div class="cand-group">
      <div class="cand-title">支払日の候補（正しいものをクリック）</div>
      <div class="cand-list">${dateChips}</div>
      ${result.dates.length ? '' : '<div class="muted" style="margin-top:6px;">レシートから日付は読み取れませんでした。</div>'}
    </div>
    <details class="ocr-all">
      <summary>候補に無い場合：金額・日付に関係しそうな行を表示</summary>
      <div id="ocr-all-lines" style="margin-top:8px;"></div>
    </details>`;

  box.querySelectorAll('.cand-chip').forEach(chip=>{
    chip.onclick = ()=>{
      const kind = chip.dataset.kind;

      else document.getElementById('ex-date').value = chip.dataset.value;
      setSelected(box, kind, chip);
      showToast('反映しました');
    };
  });
  renderAllLines(relevantLines(result.lines));
}

// 絞り込み済みの行を表示。「金額」「日付」ボタンでその行から直接反映できる
function renderAllLines(lines){
  const container = document.getElementById('ocr-all-lines');
  if(!lines.length){ container.innerHTML = '<span class="muted">該当する行がありません。</span>'; return; }
  container.innerHTML = lines.map((l,i)=>`
    <div class="ocr-line">
      <span class="txt">${escapeHtml(l)}</span>
      <span class="actions">
        <button type="button" class="ocr-apply" data-idx="${i}" data-field="amount">金額</button>
        <button type="button" class="ocr-apply" data-idx="${i}" data-field="date">日付</button>
      </span>
    </div>`).join('');
  container.querySelectorAll('.ocr-apply').forEach(btn=>{
    btn.onclick = ()=>{
      const line = lines[Number(btn.dataset.idx)];
      const field = btn.dataset.field;
      if(field === 'amount'){
        const v = extractAmountFromLine(line);
        if(v == null){ showToast('この行から金額を読み取れませんでした'); return; }
        document.getElementById('ex-amount').value = v.toLocaleString('ja-JP');
      } else {
        const v = extractDateFromLine(line);
        if(!v){ showToast('この行から日付を読み取れませんでした'); return; }
        document.getElementById('ex-date').value = v;
      }
      container.querySelectorAll(`.ocr-apply[data-field="${field}"]`).forEach(b=> b.classList.remove('applied'));
      btn.classList.add('applied');
      showToast('反映しました');
    };
  });
}

/* ▲▲▲ 変更: 保存済みの実費の編集（renderExpenseTab 内と bindExpenseTab 内に分かれています） ▲▲▲ */
function bindExpenseTab(trip){
  revokeObjectUrls();
  pendingReceipt = null;          // 再描画のたびに、保存していない撮影画像は破棄する（一時データのため）
  gcReceipts();

  // ---- 撮影／選択した画像を読み取る（画像は保存を選ばない限り、読み取り後に捨てる） ----
  const statusEl = document.getElementById('ocr-status');
  const previewEl = document.getElementById('receipt-preview');
  const editingNow = editingId ? trip.expenses.find(x=>x.id===editingId) : null;

  function renderReceiptPreview(){
    if(!pendingReceipt){ previewEl.innerHTML = ''; return; }
    const replacing = editingNow && editingNow.receiptId;
    previewEl.innerHTML = `
      <div class="receipt-preview">
        <img class="receipt-thumb-img" src="${makeUrl(pendingReceipt)}" alt="撮影した画像">
        <label><input type="checkbox" id="receipt-keep">
          このレシート画像も保存する（チェックしたときだけ保存します。この端末のブラウザ内に保存され、外部には送信されません）${replacing ? '<br>※ チェックして保存すると、保存済みの画像はこの画像に置き換わります' : ''}
        </label>
      </div>`;
  }

  async function processReceipt(file){
    document.getElementById('ocr-lines').innerHTML = '';
    previewEl.innerHTML = '';
    pendingReceipt = null;
    const storePromise = compressForStorage(file).catch(()=> null);      // 保存用の縮小画像を並行して作る
    try{
      statusEl.textContent = '読み取っています…（初回はライブラリのダウンロードに少し時間がかかります）';
      const result = await runReceiptOcrOffline(file, (msg)=>{ statusEl.textContent = msg; },
        { tripStart: trip.startDate, tripEnd: trip.endDate });
      if(result.amounts.length) document.getElementById('ex-amount').value = result.amounts[0].value.toLocaleString('ja-JP');
      // 変更: レシートに年つきの日付があればそれを使い、無ければ「読み込んだ日（今日）」を既定にする
      const reliable = result.dates.filter(c=> !c.inferred && c.wd !== 'mismatch');       // 曜日と矛盾する日付は自動入力しない
      let explicitDate = reliable[0] || null;
      const tied = reliable.length > 1 && reliable[0].score - reliable[1].score < 2;      // 候補が拮抗しているときも自動入力しない
      if(tied) explicitDate = null;
      const hadMismatch = result.dates.some(c=> !c.inferred && c.wd === 'mismatch');
      if(explicitDate) document.getElementById('ex-date').value = explicitDate.value;
      else if(!editingNow) document.getElementById('ex-date').value = todayStr();
      document.getElementById('ex-memo').value = result.store || 'OCRで読み取り（要確認）';
      renderOcrCandidates(result);
      statusEl.textContent = explicitDate
        ? '読み取り完了。一番有力な候補を入力しました。違う場合は下の候補から選んでください。'
        : (tied ? '読み取り完了。日付の候補が複数あり決められなかったため、支払日は読み込んだ日（今日）にしました。下の候補から選んでください。'
          : hadMismatch ? '読み取り完了。読み取った日付がレシートの曜日と合わなかったため、支払日は読み込んだ日（今日）にしました。下の候補を確認してください。'
          : '読み取り完了。レシートから年つきの日付が見つからなかったため、支払日は読み込んだ日（今日）にしました。別の日付にする場合は下の候補から選んでください。');
      showToast('レシートを読み取りました');
    }catch(err){
      console.error(err);
      statusEl.textContent = '読み取りに失敗しました（' + (err.message||'エラー') + '）。手入力してください。';
      showToast('OCRに失敗しました。手入力してください。');
    }
    pendingReceipt = await storePromise;      // 読み取りに失敗しても、画像の保存は選べる
    renderReceiptPreview();
  }

  // スマホ: 標準のカメラアプリを起動（高解像度）。PC: ブラウザのカメラ画面。どちらも使えなければファイル選択
  document.getElementById('btn-camera').onclick = ()=>{
    if(IS_MOBILE || !(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)){
      document.getElementById('ocr-camera').click();
    } else {
      openCameraModal(processReceipt);
    }
  };
  document.getElementById('btn-pick-file').onclick = ()=> document.getElementById('ocr-file').click();
  ['ocr-file', 'ocr-camera'].forEach(id=>{
    document.getElementById(id).onchange = (e)=>{
      const f = e.target.files[0];
      e.target.value = '';                    // 同じファイルをもう一度選んでも反応するようにする
      if(f) processReceipt(f);
    };
  });

  // ---- 保存済みレシート画像（編集中の記録） ----
  const savedImg = document.getElementById('saved-receipt-img');
  if(savedImg && editingNow){
    idbGet(editingNow.receiptId).then(blob=>{
      if(blob) savedImg.src = makeUrl(blob);
      else savedImg.alt = '画像が見つかりません';
    }).catch(()=>{});
    // 画像を削除したら、保存データに反映したうえで画像欄だけ取り除く（入力途中のフォームは消さない）
    const afterDelete = ()=>{
      saveState();
      const field = savedImg.closest('.field');
      if(field) field.remove();
    };
    savedImg.onclick = ()=> openReceiptViewer(editingNow, afterDelete);
    document.getElementById('btn-del-receipt').onclick = ()=> confirmDeleteReceipt(editingNow, afterDelete);
  }

  // ---- 追加／変更の保存 ----
  document.getElementById('btn-add-expense').onclick = async ()=>{
    const category = document.getElementById('ex-category').value;
    const actual = getNumberValue('ex-amount');
    const payer = document.getElementById('ex-payer').value;
    const date = document.getElementById('ex-date').value;
    const memo = document.getElementById('ex-memo').value.trim();
    if(!actual){ showToast('金額を入力してください'); return; }
    if(!date){ showToast('支払日を入力してください'); return; }

    // 「保存する」にチェックが入っているときだけ、画像をこの端末のブラウザ内に保存する
    let newReceiptId = null, imageFailed = false;
    const keep = document.getElementById('receipt-keep');
    if(pendingReceipt && keep && keep.checked){
      try{ newReceiptId = uid('rcp'); await idbPut(newReceiptId, pendingReceipt); }
      catch(e){ console.error(e); newReceiptId = null; imageFailed = true; }
    }
    const imageNote = imageFailed ? '（レシート画像は保存できませんでした）' : '';

    if(editingId){
      const target = trip.expenses.find(x=>x.id===editingId);
      if(target){
        Object.assign(target, { category, actual, payer, date, memo });
        if(newReceiptId){
          if(target.receiptId) { try{ await idbDelete(target.receiptId); }catch(e){} }   // 置き換え前の画像を消す
          target.receiptId = newReceiptId;
        }
      }
      editingId = null;
      rerenderPage();
      showToast((trip.settlements && trip.settlements.length
        ? '変更を保存しました。「精算」タブで精算を計算し直してください'
        : '変更を保存しました') + imageNote);
      return;
    }
    const rec = { id: uid('exp'), category, estimate:0, actual, payer, date, memo };
    if(newReceiptId) rec.receiptId = newReceiptId;
    trip.expenses.push(rec);
    rerenderPage(); showToast('実費を記録しました' + imageNote);
  };

  const cancelBtn = document.getElementById('btn-cancel-edit');
  if(cancelBtn) cancelBtn.onclick = ()=>{ editingId = null; renderTripPage(); };
  document.querySelectorAll('.btn-edit-expense').forEach(el=>{
    el.onclick = ()=>{
      editingId = el.dataset.id;
      renderTripPage();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    };
  });
  document.querySelectorAll('.btn-view-receipt').forEach(el=>{
    el.onclick = ()=> openReceiptViewer(trip.expenses.find(x=>x.id===el.dataset.id), rerenderPage);
  });
  document.querySelectorAll('.btn-del-expense').forEach(el=>{
    el.onclick = ()=>{
      const target = trip.expenses.find(x=>x.id===el.dataset.id);
      if(target && target.receiptId) idbDelete(target.receiptId).catch(()=>{});     // 記録と一緒に画像も削除
      if(editingId === el.dataset.id) editingId = null;
      trip.expenses = trip.expenses.filter(x=>x.id!==el.dataset.id);
      rerenderPage();
    };
  });
}

initTripPage('expense.html', renderExpenseTab, bindExpenseTab);
</script>
</body>
</html>
