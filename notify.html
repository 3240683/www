<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>通知｜旅費メモ</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Zen+Old+Mincho:wght@500;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css">

  <style>
    .notify-section {
      margin-bottom: 24px;
      padding: 18px;
      background: #fff;
      border-radius: 12px;
    }

    .notify-section h2 {
      margin-top: 0;
      font-size: 18px;
    }

    .notify-form {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .notify-form label {
      font-weight: 700;
    }

    .notify-form select,
    .notify-form textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font: inherit;
    }

    .notify-form textarea {
      min-height: 110px;
      resize: vertical;
    }

    .notify-message {
      padding: 14px;
      margin-bottom: 12px;
      border: 1px solid #e2e2e2;
      border-radius: 10px;
      background: #fafafa;
    }

    .notify-message p {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      margin: 10px 0;
    }

    .notify-meta {
      color: #777;
      font-size: 12px;
    }

    .notify-empty {
      color: #888;
      text-align: center;
      padding: 20px 0;
    }

    .notify-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .notify-actions button,
    .notify-form button {
      cursor: pointer;
    }

    .notify-help {
      color: #777;
      font-size: 13px;
      line-height: 1.7;
    }
  </style>
</head>

<body>

  <div id="app"></div>
  <div class="toast" id="toast"></div>

  <script src="common.js"></script>

  <script>
    // ========================================
    // HTMLエスケープ
    // ========================================

    function notifyEscapeHTML(value) {
      return String(value ?? '').replace(/[&<>"']/g, function(char) {
        return {
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#039;'
        }[char];
      });
    }


    // ========================================
    // 通知データの初期化
    // ========================================

    function ensureNotificationData(trip) {

      if (!trip.notifications) {
        trip.notifications = {
          settlement: true,
          reminder: true,
          deadline: true,
          message: true
        };
      }

      if (trip.notifications.message === undefined) {
        trip.notifications.message = true;
      }

      if (!Array.isArray(trip.notificationHistory)) {
        trip.notificationHistory = [];
      }

    }


    // ========================================
    // トースト表示
    // ========================================

    function showNotifyToast(message) {

      const toast = document.getElementById('toast');

      if (!toast) {
        alert(message);
        return;
      }

      toast.textContent = message;
      toast.classList.add('show');

      setTimeout(function() {
        toast.classList.remove('show');
      }, 2500);

    }


    // ※ 通知を追加する pushTripNotification() は common.js に移動しました（精算・支払いなど各ページから呼ぶため）。


    // ========================================
    // メッセージ通知を送信
    // ========================================

    function sendMessageNotification(trip, recipientId, message) {

      ensureNotificationData(trip);

      if (!trip.notifications.message) {
        showNotifyToast('メッセージ通知が設定でOFFになっています');
        return false;
      }

      const text = message.trim();

      if (!recipientId) {
        showNotifyToast('送信相手を選択してください');
        return false;
      }

      if (!text) {
        showNotifyToast('メッセージを入力してください');
        return false;
      }

      if (text.length > 500) {
        showNotifyToast('メッセージは500文字以内で入力してください');
        return false;
      }

      const senderId = state.currentUserId;

      trip.notificationHistory.unshift({
        id: 'message_' + Date.now() + '_' +
          Math.random().toString(36).slice(2, 7),

        type: 'message',
        message: text,
        senderId: senderId,
        recipientId: recipientId,
        createdAt: new Date().toISOString()
      });

      saveState();

      showNotifyToast('メッセージを保存しました');

      return true;

    }


    // ========================================
    // 日時表示
    // ========================================

    function formatNotifyDate(value) {

      if (!value) return '';

      const date = new Date(value);

      if (Number.isNaN(date.getTime())) {
        return '';
      }

      return date.toLocaleString('ja-JP');

    }


    // ========================================
    // 参加者名を取得
    // ========================================

    function getNotifyMemberName(trip, userId) {

      const member = (trip.members || []).find(function(item) {
        return item.id === userId;
      });

      return member ? member.name : '不明な参加者';

    }


    // ========================================
    // 通知画面を表示
    // ========================================

    function renderNotifyTab(trip) {

      ensureNotificationData(trip);

      const members = trip.members || [];

      const memberOptions = members.map(function(member) {

        return `
          <option value="${notifyEscapeHTML(member.id)}">
            ${notifyEscapeHTML(member.name)}
          </option>
        `;

      }).join('');


      // 通知履歴
      const historyHTML = trip.notificationHistory.map(function(item) {

        const senderName = getNotifyMemberName(
          trip,
          item.senderId
        );

        const recipientName = item.recipientId
          ? getNotifyMemberName(trip, item.recipientId)
          : '全員';

        const isMessage = item.type === 'message';

        return `
          <div class="notify-message">

            <div class="notify-meta">
              ${isMessage ? 'メッセージ' : ({ settlement:'精算のお知らせ', reminder:'入力リマインダー', deadline:'支払い期限' }[item.type] || 'お知らせ')}
              ／
              ${notifyEscapeHTML(formatNotifyDate(item.createdAt))}
            </div>

            ${
              isMessage
                ? `
                  <div class="notify-meta">
                    送信者：${notifyEscapeHTML(senderName)}
                    ／
                    宛先：${notifyEscapeHTML(recipientName)}
                  </div>
                `
                : ''
            }

            <p>${notifyEscapeHTML(item.message)}</p>

          </div>
        `;

      }).join('');


      return `

        <!-- メッセージ送信 -->

        <section class="notify-section">

          <h2>メッセージを送る</h2>

          <p class="notify-help">
            参加者を選択してメッセージを送信できます。
            送信した内容は、この端末の通知履歴に保存されます。
          </p>

          <div class="notify-form">

            <label for="messageRecipient">
              送信相手
            </label>

            <select id="messageRecipient">

              <option value="">
                送信相手を選択してください
              </option>

              ${memberOptions}

            </select>


            <label for="messageText">
              メッセージ
            </label>

            <textarea
              id="messageText"
              maxlength="500"
              placeholder="例：旅費の入力をお願いします。"
            ></textarea>


            <button
              type="button"
              id="sendMessageBtn"
              class="btn"
            >
              メッセージを送信
            </button>

          </div>

        </section>


        <!-- 通知設定 -->

        <section class="notify-section">

          <h2>通知設定</h2>

          <p class="notify-help">
            ・精算通知：精算を計算したとき、支払い・受け取りを確認したとき<br>
            ・入力リマインダー：旅行中でその日の支出が未記録のとき／旅行終了後も実費が1件もないとき<br>
            ・支払い期限：旅行終了から${PAYMENT_DEADLINE_DAYS}日が過ぎても精算が終わっていないとき<br>
            通知はこの端末の履歴にだけ残ります（相手の端末には届きません）。
          </p>

          <div class="notify-form">

            <label>
              <input
                type="checkbox"
                id="messageNotificationSetting"
                ${trip.notifications.message ? 'checked' : ''}
              >
              メッセージ通知
            </label>


            <label>
              <input
                type="checkbox"
                id="settlementNotificationSetting"
                ${trip.notifications.settlement ? 'checked' : ''}
              >
              精算通知
            </label>


            <label>
              <input
                type="checkbox"
                id="reminderNotificationSetting"
                ${trip.notifications.reminder ? 'checked' : ''}
              >
              入力リマインダー
            </label>


            <label>
              <input
                type="checkbox"
                id="deadlineNotificationSetting"
                ${trip.notifications.deadline ? 'checked' : ''}
              >
              支払い期限通知
            </label>


            <button
              type="button"
              id="saveNotifySettingBtn"
              class="btn"
            >
              設定を保存
            </button>

          </div>

        </section>


        <!-- 通知履歴 -->

        <section class="notify-section">

          <h2>通知履歴</h2>

          <div class="notify-actions">

            <button
              type="button"
              id="clearNotifyHistoryBtn"
              class="btn"
            >
              履歴を削除
            </button>

          </div>


          <div style="margin-top: 15px;">

            ${
              historyHTML ||
              '<div class="notify-empty">通知履歴はありません。</div>'
            }

          </div>

        </section>


        <!-- ブラウザ通知 -->

        <section class="notify-section">

          <h2>ブラウザ通知</h2>

          <p class="notify-help">
            ブラウザ通知は、この端末でブラウザ通知に対応している場合に利用できます。
            相手の端末へ通知を送信する機能ではありません。
          </p>

          <button
            type="button"
            id="requestBrowserNotifyBtn"
            class="btn"
          >
            ブラウザ通知を許可する
          </button>

        </section>

      `;

    }


    // ========================================
    // 通知画面のイベント設定
    // ========================================

    function bindNotifyTab(trip) {

      ensureNotificationData(trip);


      // メッセージ送信
      const sendButton = document.getElementById(
        'sendMessageBtn'
      );

      if (sendButton) {

        sendButton.addEventListener('click', async function() {

          const recipientId =
            document.getElementById(
              'messageRecipient'
            ).value;

          const message =
            document.getElementById(
              'messageText'
            ).value;

          const success = sendMessageNotification(
            trip,
            recipientId,
            message
          );

          if (success) {

            await saveState();

            renderTripPage();

          }

        });

      }


      // 通知設定保存
      const saveButton = document.getElementById(
        'saveNotifySettingBtn'
      );

      if (saveButton) {

        saveButton.addEventListener('click', async function() {

          trip.notifications.message =
            document.getElementById(
              'messageNotificationSetting'
            ).checked;

          trip.notifications.settlement =
            document.getElementById(
              'settlementNotificationSetting'
            ).checked;

          trip.notifications.reminder =
            document.getElementById(
              'reminderNotificationSetting'
            ).checked;

          trip.notifications.deadline =
            document.getElementById(
              'deadlineNotificationSetting'
            ).checked;

          await saveState();

          showNotifyToast('通知設定を保存しました');

          renderTripPage();

        });

      }


      // 通知履歴削除
      const clearButton = document.getElementById(
        'clearNotifyHistoryBtn'
      );

      if (clearButton) {

        clearButton.addEventListener('click', async function() {

          if (!confirm('通知履歴をすべて削除しますか？')) {
            return;
          }

          trip.notificationHistory = [];

          await saveState();

          showNotifyToast('通知履歴を削除しました');

          renderTripPage();

        });

      }


      // ブラウザ通知許可
      const browserButton = document.getElementById(
        'requestBrowserNotifyBtn'
      );

      if (browserButton) {

        browserButton.addEventListener('click', async function() {

          if (!('Notification' in window)) {

            showNotifyToast(
              'このブラウザは通知に対応していません'
            );

            return;

          }

          const permission =
            await Notification.requestPermission();

          if (permission === 'granted') {

            showNotifyToast('ブラウザ通知を許可しました');

          } else {

            showNotifyToast(
              'ブラウザ通知は許可されませんでした'
            );

          }

        });

      }

    }


    // ========================================
    // 通知画面の初期化
    // ========================================

    initTripPage(
      'notify.html',
      renderNotifyTab,
      bindNotifyTab
    );

  </script>

</body>
</html>
