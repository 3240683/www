<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>参加者｜旅費メモ</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="styles.css">
</head>

<body>

<div id="app"></div>
<div class="toast" id="toast"></div>

<script src="common.js"></script>

<script>

/* =========================================================
   members.html: 3.8 参加者管理画面
   ・招待URLから参加した人の一覧表示
   ・参加者の追加と削除
   ・オーナー権限の変更
   ・端数調整の設定
   ・オーナーのみ設定変更可能
========================================================= */


/* ---------------------------------------------------------
   1. データの初期化
--------------------------------------------------------- */

function ensureMembersData(trip) {

  if (!Array.isArray(trip.members)) {
    trip.members = [];
  }

  if (trip.roundingUnit == null) {
    trip.roundingUnit = 1;
  }

  if (!trip.roundingMethod) {
    trip.roundingMethod = 'random';
  }

}


/* ---------------------------------------------------------
   2. オーナー確認
--------------------------------------------------------- */

function canManageMembers(trip) {

  return isOwner(trip, state.currentUserId);

}


/* ---------------------------------------------------------
   3. 参加者一覧の表示
--------------------------------------------------------- */

function renderMembersTab(trip) {

  ensureMembersData(trip);

  const iAmOwner = canManageMembers(trip);

  const members = trip.members;

  const rows = members.map(m => {

    return `
      <tr>

        <td>
          ${escapeHtml(m.name)}
          ${
            m.owner
              ? '<span class="badge-owner">オーナー</span>'
              : ''
          }
        </td>

        <td>
          ${m.owner ? 'オーナー' : '一般'}
        </td>

        <td>
          ${
            m.owner
              ? '管理者'
              : '招待URL'
          }
        </td>

        <td>

          ${
            iAmOwner && !m.owner
              ? `
                <button
                  class="btn ghost btn-make-owner"
                  data-id="${escapeHtml(m.id)}"
                  type="button">
                  権限変更
                </button>
              `
              : ''
          }

          ${
            iAmOwner && !m.owner
              ? `
                <button
                  class="btn ghost btn-remove-member"
                  data-id="${escapeHtml(m.id)}"
                  type="button">
                  削除
                </button>
              `
              : ''
          }

        </td>

      </tr>
    `;

  }).join('');


  return `

    <!-- 参加者一覧 -->

    <div class="card">

      <div class="section-title">
        <h2>参加者一覧</h2>
      </div>

      <p class="muted">
        現在の参加者：${members.length}人
      </p>

      <div style="overflow-x:auto;">

        <table class="data-table">

          <thead>
            <tr>
              <th>名前</th>
              <th>権限</th>
              <th>招待方法</th>
              <th>操作</th>
            </tr>
          </thead>

          <tbody>

            ${
              rows ||
              '<tr><td colspan="4">参加者はいません。</td></tr>'
            }

          </tbody>

        </table>

      </div>


      ${
        iAmOwner
          ? `
            <div class="btn-row">

              <button
                class="btn secondary"
                id="btn-add-member-demo"
                type="button">

                参加者を追加

              </button>

            </div>
          `
          : `
            <p class="muted" style="margin-top:12px;">
              参加者の追加・削除・権限変更は
              オーナーのみ行えます。
            </p>
          `
      }

      <p class="muted" style="margin-top:8px;">
        招待URLから参加した人は、
        この一覧に自動的に追加されます。
      </p>

    </div>


    <!-- 端数調整の設定 -->

    <div class="card">

      <div class="section-title">
        <h2>端数調整の設定</h2>
      </div>

      ${
        iAmOwner
          ? `
            <p class="muted">
              端数調整の設定を変更できます。
            </p>
          `
          : `
            <p class="muted">
              設定を変更できるのはオーナーのみです。
              現在の設定を表示しています。
            </p>
          `
      }

      <div class="grid2">

        <div class="field">

          <label for="round-unit">
            精算単位
          </label>

          <select id="round-unit"
            ${iAmOwner ? '' : 'disabled'}>

            <option value="1">1円（通常）</option>

            <option value="10">10円単位</option>

            <option value="100">100円単位</option>

            <option value="500">500円単位</option>

            <option value="1000">1000円単位</option>

          </select>

        </div>


        <div class="field">

          <label for="round-method">
            端数負担方法
          </label>

          <select id="round-method"
            ${iAmOwner ? '' : 'disabled'}>

            <option value="random">
              ランダム
            </option>

            <option value="rotation">
              持ち回り
            </option>

            <option value="owner">
              管理者負担
            </option>

            <option value="payer_priority">
              立替者優先
            </option>

          </select>

        </div>

      </div>


      ${
        iAmOwner
          ? `
            <div class="btn-row">

              <button
                class="btn accent"
                id="btn-save-rounding"
                type="button">

                設定を保存

              </button>

            </div>
          `
          : ''
      }

    </div>

  `;

}


/* ---------------------------------------------------------
   4. ボタンの動作
--------------------------------------------------------- */

function bindMembersTab(trip) {

  ensureMembersData(trip);

  const iAmOwner = canManageMembers(trip);


  /* ---------------------------------------
     端数調整設定の初期表示
  --------------------------------------- */

  document.getElementById('round-unit').value =
    String(trip.roundingUnit);

  document.getElementById('round-method').value =
    trip.roundingMethod;


  /* ---------------------------------------
     端数調整設定の保存
     オーナーのみ
  --------------------------------------- */

  const saveButton =
    document.getElementById('btn-save-rounding');

  if (saveButton) {

    saveButton.onclick = () => {

      // 権限を再確認
      if (!canManageMembers(trip)) {

        showToast(
          '設定を変更できるのはオーナーのみです'
        );

        rerenderPage();
        return;

      }

      trip.roundingUnit = Number(
        document.getElementById('round-unit').value
      );

      trip.roundingMethod =
        document.getElementById('round-method').value;

      if (typeof saveTrip === 'function') {
        saveTrip(trip);
      }

      rerenderPage();

      showToast(
        '端数調整の設定を保存しました'
      );

    };

  }


  /* ---------------------------------------
     参加者追加
     オーナーのみ
  --------------------------------------- */

  const addButton =
    document.getElementById('btn-add-member-demo');

  if (addButton) {

    addButton.onclick = () => {

      if (!canManageMembers(trip)) {

        showToast(
          '参加者を追加できるのはオーナーのみです'
        );

        return;

      }

      const name = prompt(
        '参加者の名前を入力してください'
      );

      if (!name || !name.trim()) {
        return;
      }

      const cleanName = name.trim();

      const exists = trip.members.some(m =>
        m.name === cleanName
      );

      if (exists) {

        showToast(
          '同じ名前の参加者がすでにいます'
        );

        return;

      }

      trip.members.push({

        id: uid('mem'),

        name: cleanName,

        owner: false

      });

      if (typeof saveTrip === 'function') {
        saveTrip(trip);
      }

      rerenderPage();

      showToast('参加者を追加しました');

    };

  }


  /* ---------------------------------------
     オーナー権限の譲渡
     オーナーのみ
  --------------------------------------- */

  document
    .querySelectorAll('.btn-make-owner')
    .forEach(el => {

      el.onclick = () => {

        if (!canManageMembers(trip)) {

          showToast(
            '権限の変更はオーナーのみ行えます'
          );

          return;

        }

        const member = trip.members.find(
          m => m.id === el.dataset.id
        );

        if (!member || member.owner) {
          return;
        }

        openYesNoModal(

          `${member.name}さんにオーナーの権限を譲渡しますか？`,

          () => {

            // オーナーを一人だけにする
            trip.members.forEach(m => {
              m.owner = false;
            });

            member.owner = true;

            if (typeof saveTrip === 'function') {
              saveTrip(trip);
            }

            rerenderPage();

            showToast(
              `${member.name}さんにオーナー権限を譲渡しました`
            );

          },

          () => {
            // キャンセル
          }

        );

      };

    });


  /* ---------------------------------------
     参加者の削除
     オーナーのみ
  --------------------------------------- */

  document
    .querySelectorAll('.btn-remove-member')
    .forEach(el => {

      el.onclick = () => {

        if (!canManageMembers(trip)) {

          showToast(
            '参加者を削除できるのはオーナーのみです'
          );

          return;

        }

        const member = trip.members.find(
          m => m.id === el.dataset.id
        );

        if (!member || member.owner) {
          return;
        }

        if (!confirm(
          `${member.name}さんを削除しますか？`
        )) {
          return;
        }

        trip.members = trip.members.filter(
          m => m.id !== el.dataset.id
        );

        if (typeof saveTrip === 'function') {
          saveTrip(trip);
        }

        rerenderPage();

        showToast('参加者を削除しました');

      };

    });

}


/* ---------------------------------------------------------
   5. ページ初期化
--------------------------------------------------------- */

initTripPage(
  'members.html',
  renderMembersTab,
  bindMembersTab
);

</script>

</body>
</html>
