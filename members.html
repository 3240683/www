<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>参加者｜旅費メモ</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Zen+Old+Mincho:wght@500;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css">
  <script src="common.js"></script>

  <style>
    .member-section {
      background: #fff;
      border-radius: 12px;
      padding: 20px;
      margin: 20px 0;
    }

    .member-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .member-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px;
      border: 1px solid #e5e5e5;
      border-radius: 10px;
    }

    .member-name {
      font-weight: 700;
    }

    .owner-label {
      display: inline-block;
      margin-left: 8px;
      padding: 3px 8px;
      border-radius: 20px;
      background: #eee5d5;
      font-size: 12px;
    }

    .member-form {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    .member-form input {
      flex: 1;
      min-width: 0;
    }

    .member-note {
      color: #777;
      font-size: 13px;
      margin-top: 10px;
    }

    .member-disabled {
      opacity: .65;
    }

    @media (max-width: 600px) {
      .member-form {
        flex-direction: column;
      }

      .member-item {
        align-items: flex-start;
      }
    }
  </style>
</head>

<body>
  <div id="app"></div>
  <div class="toast" id="toast"></div>

  <script>
    function escapeHTML(value) {
      return String(value ?? '').replace(/[&<>"']/g, char => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      })[char]);
    }

    function renderMembersTab(trip) {
      if (!Array.isArray(trip.members)) {
        trip.members = [];
      }

      const owner = isOwner(trip, state.currentUserId);

      const membersHTML = trip.members.map(member => `
        <div class="member-item">
          <div>
            <span class="member-name">
              ${escapeHTML(member.name)}
            </span>

            ${
              member.owner === true
                ? '<span class="owner-label">オーナー</span>'
                : ''
            }
          </div>

          ${
            owner && member.owner !== true
              ? `
                <button
                  type="button"
                  class="btn ghost btn-remove-member"
                  data-id="${escapeHTML(member.id)}">
                  削除
                </button>
              `
              : ''
          }
        </div>
      `).join('');

      return `
        <section class="member-section">
          <h2>参加者一覧</h2>

          <div class="member-list">
            ${
              membersHTML ||
              '<p>参加者はいません。</p>'
            }
          </div>
        </section>

        <section class="member-section">
          <h2>参加者を追加</h2>

          ${
            owner
              ? `
                <form id="add-member-form" class="member-form">
                  <input
                    type="text"
                    id="member-name"
                    placeholder="参加者の名前を入力"
                    maxlength="30"
                    required
                  >

                  <button type="submit" class="btn primary">
                    追加する
                  </button>
                </form>

                <p class="member-note">
                  追加できるのはオーナーのみです。
                </p>
              `
              : `
                <p class="member-note">
                  参加者の追加はオーナーのみ行えます。
                </p>
              `
          }
        </section>

        <section class="member-section">
          <h2>端数調整設定</h2>

          <label for="rounding-unit">
            端数調整の単位
          </label>

          <select id="rounding-unit" ${owner ? '' : 'disabled'}>
            <option value="1" ${
              (trip.roundingUnit || 1) === 1 ? 'selected' : ''
            }>1円単位</option>

            <option value="10" ${
              trip.roundingUnit === 10 ? 'selected' : ''
            }>10円単位</option>

            <option value="100" ${
              trip.roundingUnit === 100 ? 'selected' : ''
            }>100円単位</option>
          </select>

          ${
            owner
              ? ''
              : '<p class="member-note">設定変更はオーナーのみ行えます。</p>'
          }
        </section>
      `;
    }

    function bindMembersTab(trip) {
      const owner = isOwner(trip, state.currentUserId);

      // 参加者追加
      const form = document.getElementById('add-member-form');

      if (form) {
        form.addEventListener('submit', function(event) {
          event.preventDefault();

          if (!isOwner(trip, state.currentUserId)) {
            showToast('オーナーのみ追加できます');
            return;
          }

          const input = document.getElementById('member-name');
          const name = input.value.trim();

          if (!name) {
            showToast('名前を入力してください');
            return;
          }

          if (!Array.isArray(trip.members)) {
            trip.members = [];
          }

          trip.members.push({
            id: uid('mem'),
            name: name,
            owner: false
          });

          rerenderPage();
          showToast('参加者を追加しました');
        });
      }

      // 参加者削除
      document.querySelectorAll('.btn-remove-member').forEach(button => {
        button.addEventListener('click', function() {
          if (!isOwner(trip, state.currentUserId)) {
            showToast('オーナーのみ削除できます');
            return;
          }

          const memberId = button.dataset.id;

          const member = trip.members.find(m => m.id === memberId);

          if (!member) {
            showToast('参加者が見つかりません');
            return;
          }

          // オーナー自身は削除禁止
          if (member.owner === true) {
            showToast('オーナーは削除できません');
            return;
          }

          if (!confirm(member.name + 'さんを削除しますか？')) {
            return;
          }

          trip.members = trip.members.filter(
            m => m.id !== memberId
          );

          rerenderPage();
          showToast('参加者を削除しました');
        });
      });

      // 端数調整設定
      const roundingSelect = document.getElementById('rounding-unit');

      if (roundingSelect) {
        roundingSelect.addEventListener('change', function() {
          if (!isOwner(trip, state.currentUserId)) {
            showToast('オーナーのみ変更できます');
            return;
          }

          trip.roundingUnit = Number(roundingSelect.value);

          rerenderPage();
          showToast('端数調整設定を変更しました');
        });
      }
    }

    initTripPage(
      'members.html',
      renderMembersTab,
      bindMembersTab
    );
  </script>
</body>
</html>
