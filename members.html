<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>参加者管理｜旅費メモ</title>

  <link rel="stylesheet" href="styles.css">

  <style>
    .members-section {
      background: white;
      border: 1px solid #e5e5e5;
      border-radius: 12px;
      padding: 20px;
      margin: 18px 0;
    }

    .member-card {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 15px 0;
      border-bottom: 1px solid #eee;
    }

    .member-card:last-child {
      border-bottom: none;
    }

    .member-info {
      min-width: 0;
    }

    .member-name {
      font-weight: bold;
      font-size: 16px;
    }

    .member-detail {
      color: #777;
      font-size: 13px;
      margin-top: 5px;
    }

    .owner-badge {
      display: inline-block;
      background: #e8f3ff;
      color: #27639a;
      border-radius: 20px;
      padding: 4px 9px;
      font-size: 12px;
      margin-left: 5px;
    }

    .member-delete {
      flex-shrink: 0;
    }

    .member-empty {
      text-align: center;
      color: #888;
      padding: 25px 0;
    }
  </style>
</head>

<body>

<div id="app"></div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script src="common.js"></script>

<script>

/*
=================================================
参加者管理画面
=================================================
*/


// 参加者一覧を表示
function renderMembersTab(trip) {

  const members = trip.members || [];

  const owner =
    isOwner(trip, state.currentUserId);

  const memberHtml = members.map(member => {

    const tags = [];

    if (member.role) tags.push(member.role);
    if (member.drink) tags.push('飲酒');
    if (member.exempt) tags.push('今回免除');

    const isMe =
      member.id === state.currentUserId;

    return `
      <div class="member-card">

        <div class="member-info">

          <div class="member-name">
            ${escapeHtml(member.name)}

            ${member.owner
              ? '<span class="owner-badge">管理者</span>'
              : ''
            }

            ${isMe
              ? '<span class="owner-badge">自分</span>'
              : ''
            }
          </div>

          <div class="member-detail">
            ${tags.length
              ? escapeHtml(tags.join('・'))
              : '役割などの設定なし'
            }
          </div>

        </div>

        ${
          owner && !member.owner
          ? `
            <button
              class="btn secondary member-delete"
              data-member-id="${escapeHtml(member.id)}"
            >
              削除
            </button>
          `
          : ''
        }

      </div>
    `;

  }).join('');

  return `
    <section class="members-section">

      <h3>参加者一覧</h3>

      <p>
        現在の参加者：
        <strong>${members.length}人</strong>
      </p>

      <div id="members-list">

        ${
          members.length
            ? memberHtml
            : '<div class="member-empty">参加者はいません。</div>'
        }

      </div>

    </section>

    <section class="members-section">

      <h3>参加者を追加する</h3>

      <p>
        新しい参加者を追加する場合は、
        招待画面から招待URLを発行してください。
      </p>

      <a
        class="btn accent"
        href="invite.html?trip=${encodeURIComponent(trip.id)}"
      >
        招待画面へ
      </a>

    </section>
  `;
}


// 参加者削除
async function deleteMember(trip, memberId) {

  const member =
    trip.members.find(m => m.id === memberId);

  if (!member) return;

  if (!isOwner(trip, state.currentUserId)) {
    showToast('管理者のみ削除できます');
    return;
  }

  if (member.owner) {
    showToast('管理者は削除できません');
    return;
  }

  openYesNoModal(
    member.name + 'さんを参加者から削除しますか？',
    async () => {

      try {

        const { error } = await supabaseClient
          .from('trip_members')
          .delete()
          .eq('trip_id', trip.id)
          .eq('user_id', member.id);

        if (error) throw error;

        trip.members =
          trip.members.filter(m => m.id !== memberId);

        await saveState();

        renderTripPage();

        showToast('参加者を削除しました');

      } catch (error) {

        console.error(error);

        showToast('削除できませんでした');

      }

    }
  );
}


// ボタン設定
function bindMembersTab(trip) {

  document
    .querySelectorAll('[data-member-id]')
    .forEach(button => {

      button.addEventListener('click', () => {

        const memberId =
          button.dataset.memberId;

        deleteMember(trip, memberId);

      });

    });

}


// ページ初期化
initTripPage(
  'members.html',
  renderMembersTab,
  bindMembersTab
);

</script>

</body>
</html>
