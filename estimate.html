<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>見積もり｜旅費メモ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>

<script src="common.js"></script>
<script>
/* =========================================================
   estimate.html: 交通費計算・見積もり画面
   担当③の変更はこのファイル内に限定
========================================================= */

function renderEstimateTab(trip) {
  const e = trip.estimate || {};
  const calc = trip.transportCalc || {};
  const total = ESTIMATE_CATEGORIES.reduce(
    (sum, [key]) => sum + (Number(e[key]) || 0), 0
  );
  const people = Math.max(1, (trip.members || []).length);
  const budget = Number(trip.estimateBudget) || 0;
  const mode = calc.mode || trip.transport?.method || 'train';

  const fields = ESTIMATE_CATEGORIES.map(([key, label]) => `
    <div class="field">
      <label for="est-${key}">${label}</label>
      <input type="text" inputmode="numeric" id="est-${key}"
        value="${Number(e[key] || 0).toLocaleString('ja-JP')}"
        oninput="formatMoneyInput(this)">
    </div>
  `).join('');

  const mapsUrl = 'https://www.google.com/maps/dir/?api=1&origin='
    + encodeURIComponent(trip.departure || '')
    + '&destination='
    + encodeURIComponent(trip.destination || '');

  return `
  <div class="card">
    <div class="section-title">
      <h2>費用の見積もり</h2>
      <span class="muted">交通費や旅行予算を計算できます</span>
    </div>

    <div class="flow-note" style="margin-bottom:16px;">
      出発地：${escapeHtml(trip.departure || '未設定')}
      → 目的地：${escapeHtml(trip.destination || '未設定')}
      <p>実際の経路や運賃は、地図や交通機関の公式情報で確認してください。</p>
      <a href="${mapsUrl}" target="_blank" rel="noopener noreferrer">
        Googleマップで経路を確認 ↗
      </a>
    </div>

    <h3>交通費の計算</h3>
    <div class="grid3" style="margin-top:12px;">
      <div class="field">
        <label for="est-transport-mode">交通手段</label>
        <select id="est-transport-mode">
          <option value="train">電車</option>
          <option value="shinkansen">新幹線</option>
          <option value="car">車</option>
          <option value="plane">飛行機</option>
          <option value="bus">バス</option>
        </select>
      </div>

      <div class="field" id="est-fare-field">
        <label for="est-oneway-fare">片道運賃（1人分・円）</label>
        <input type="text" inputmode="numeric" id="est-oneway-fare"
          value="${Number(calc.oneWayFare ?? trip.transport?.oneWayFare ?? 0).toLocaleString('ja-JP')}"
          oninput="formatMoneyInput(this)">
      </div>

      <div class="field" id="est-distance-field">
        <label for="est-distance">車の片道距離（km）</label>
        <input type="number" min="0.1" step="0.1"
          id="est-distance" value="${calc.distance ?? ''}" placeholder="例）120">
      </div>

      <div class="field" id="est-economy-field">
        <label for="est-economy">車の燃費（km/L）</label>
        <input type="number" min="0.1" step="0.1"
          id="est-economy" value="${calc.economy ?? 15}">
      </div>

      <div class="field" id="est-gas-price-field">
        <label for="est-gas-price">ガソリン単価（円/L）</label>
        <input type="number" min="0" step="1"
          id="est-gas-price" value="${calc.gasPrice ?? 175}">
      </div>

      <div class="field" id="est-toll-field">
        <label for="est-toll">往復の高速料金（円）</label>
        <input type="text" inputmode="numeric" id="est-toll"
          value="${Number(calc.toll || 0).toLocaleString('ja-JP')}"
          oninput="formatMoneyInput(this)">
      </div>

      <div class="field" id="est-parking-field">
        <label for="est-parking">駐車料金（合計・円）</label>
        <input type="text" inputmode="numeric" id="est-parking"
          value="${Number(calc.parking || 0).toLocaleString('ja-JP')}"
          oninput="formatMoneyInput(this)">
      </div>
    </div>

    <div class="btn-row" style="margin-top:12px;">
      <button class="btn secondary sm" id="btn-calc-transport">交通費を計算</button>
    </div>

    <div class="flow-note" id="est-transport-help" style="margin-top:12px;" aria-live="polite"></div>

    <h3 style="margin-top:24px;">費用内訳</h3>
    <p class="muted">交通費の計算結果は「交通費」に反映されます。宿泊費などは合計金額を入力してください。</p>
    <div class="grid3" style="margin-top:12px;">
      ${fields}
    </div>

    <div class="field" style="margin-top:16px;max-width:360px;">
      <label for="est-budget">旅行全体の予算（円・任意）</label>
      <input type="text" inputmode="numeric" id="est-budget"
        value="${budget.toLocaleString('ja-JP')}"
        oninput="formatMoneyInput(this)">
    </div>

    <div class="kpi-row" style="margin-top:12px;">
      <div class="kpi">
        <div class="kpi-label">総見積金額</div>
        <div class="kpi-value" id="est-total-preview">${yen(total)}</div>
      </div>
      <div class="kpi">
        <div class="kpi-label">一人当たり（${people}人）</div>
        <div class="kpi-value" id="est-person-preview">${yen(total / people)}</div>
      </div>
      <div class="kpi">
        <div class="kpi-label">予算残額</div>
        <div class="kpi-value" id="est-budget-preview">${budget ? yen(budget - total) : '未設定'}</div>
      </div>
    </div>

    <div class="btn-row" style="margin-top:16px;">
      <button class="btn accent" id="btn-save-estimate">見積もりを保存</button>
    </div>
  </div>`;
}

function bindEstimateTab(trip) {
  const $ = id => document.getElementById(id);
  const modeSelect = $('est-transport-mode');
  const carFieldIds = [
    'est-distance-field', 'est-economy-field', 'est-gas-price-field',
    'est-toll-field', 'est-parking-field'
  ];

  modeSelect.value = trip.transportCalc?.mode || trip.transport?.method || 'train';

  function updatePreview() {
    const total = ESTIMATE_CATEGORIES.reduce(
      (sum, [key]) => sum + getNumberValue('est-' + key), 0
    );
    const people = Math.max(1, (trip.members || []).length);
    const budget = getNumberValue('est-budget');

    $('est-total-preview').textContent = yen(total);
    $('est-person-preview').textContent = yen(total / people);
    $('est-budget-preview').textContent = budget ? yen(budget - total) : '未設定';
  }

  function updateModeFields() {
    const isCar = modeSelect.value === 'car';
    $('est-fare-field').style.display = isCar ? 'none' : '';
    carFieldIds.forEach(id => { $(id).style.display = isCar ? '' : 'none'; });
    $('est-transport-help').textContent = isCar
      ? '車：片道距離×2÷燃費×ガソリン単価＋往復高速料金＋駐車料金。車の費用は車全体の合計として計算します。'
      : '電車・新幹線・飛行機・バス：確認した片道運賃×2×参加人数で計算します。運賃は自動取得ではないため、公式情報で確認して入力してください。';
  }

  function saveCalcInputs() {
    trip.transportCalc = {
      mode: modeSelect.value,
      oneWayFare: getNumberValue('est-oneway-fare'),
      distance: Number($('est-distance').value) || 0,
      economy: Number($('est-economy').value) || 15,
      gasPrice: Number($('est-gas-price').value) || 0,
      toll: getNumberValue('est-toll'),
      parking: getNumberValue('est-parking')
    };
  }

  modeSelect.addEventListener('change', updateModeFields);

  $('btn-calc-transport').onclick = () => {
    const mode = modeSelect.value;
    const people = Math.max(1, (trip.members || []).length);
    let cost;

    if (mode === 'car') {
      const distance = Number($('est-distance').value);
      const economy = Number($('est-economy').value);
      const gasPrice = Number($('est-gas-price').value);
      const toll = getNumberValue('est-toll');
      const parking = getNumberValue('est-parking');

      if (!Number.isFinite(distance) || distance <= 0 ||
          !Number.isFinite(economy) || economy <= 0 ||
          !Number.isFinite(gasPrice) || gasPrice < 0) {
        showToast('距離・燃費・ガソリン単価を正しく入力してください');
        return;
      }
      cost = Math.ceil((distance * 2 / economy) * gasPrice) + toll + parking;
    } else {
      const fare = getNumberValue('est-oneway-fare');
      if (fare <= 0) {
        showToast('確認した片道運賃を入力してください');
        return;
      }
      cost = fare * 2 * people;
    }

    $('est-transport').value = Math.round(cost).toLocaleString('ja-JP');
    saveCalcInputs();
    updatePreview();
    showToast('交通費を反映しました。内容を確認して「見積もりを保存」してください');
  };

  document.querySelectorAll('#app input').forEach(input => {
    input.addEventListener('input', updatePreview);
  });

  $('btn-save-estimate').onclick = () => {
    ESTIMATE_CATEGORIES.forEach(([key]) => {
      trip.estimate[key] = getNumberValue('est-' + key);
    });
    trip.estimateBudget = getNumberValue('est-budget');
    saveCalcInputs();
    rerenderPage();
    showToast('見積もりを保存しました');
  };

  updateModeFields();
  updatePreview();
}

initTripPage('estimate.html', renderEstimateTab, bindEstimateTab);
</script>
</body>
</html>
