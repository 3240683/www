<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>招待｜旅費メモ</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="styles.css">
</head>

<body>

<div id="app"></div>
<div class="toast" id="toast"></div>

<script src="common.js"></script>

<script>

/* =========================================================
   invite.html
   参加者追加・招待URL発行・招待URLからの参加
========================================================= */


/* ---------------------------------------------------------
   1. HTMLエスケープ
--------------------------------------------------------- */

function escapeHTML(value) {
  return String(value ?? '').replace(/[&<>"']/g, ch => ({
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#39;'
  })[ch]);
}


/* ---------------------------------------------------------
   2. 招待データの初期化
--------------------------------------------------------- */

function ensureInviteData(trip) {

  if (!Array.isArray(trip.participants)) {
    trip.participants = [];
  }

  if (!trip.invite) {
    trip.invite = null;
  }

}


/* ---------------------------------------------------------
   3. 招待トークンの作成
--------------------------------------------------------- */

function makeInviteToken() {

  if (window.crypto && crypto.randomUUID) {
    return crypto.randomUUID().replace(/-/g, '');
  }

  if (window.crypto && crypto.getRandomValues) {

    return Array.from(
      crypto.getRandomValues(new Uint8Array(24))
    )
    .map(n => n.toString(16).padStart(2, '0'))
    .join('');

  }

  return Date.now().toString(36) +
    Math.random().toString(36).slice(2) +
    Math.random().toString(36).slice(2);

}


/* ---------------------------------------------------------
   4. 参加者IDの作成
--------------------------------------------------------- */

function createParticipantId() {

  if (window.crypto && crypto.randomUUID) {
    return crypto.randomUUID();
  }

  return 'prt_' + Date.now() +
    Math.random().toString(36).slice(2);

}


/* ---------------------------------------------------------
   5. 招待URLのトークン取得
--------------------------------------------------------- */

function getJoinToken() {

  const params = new URLSearchParams(
    window.location.search
  );

  return params.get('join');

}


/* ---------------------------------------------------------
   6. 招待URLの有効期限確認
--------------------------------------------------------- */

function isInviteValid(invite, token) {

  if (!invite) {
    return false;
  }

  if (!token || invite.token !== token) {
    return false;
  }

  if (!invite.expiry) {
    return false;
  }

  const expiryDate = new Date(
    invite.expiry + 'T23:59:59'
  );

  if (Number.isNaN(expiryDate.getTime())) {
    return false;
  }

  if (expiryDate < new Date()) {
    return false;
  }

  if (Number(invite.remaining) <= 0) {
    return false;
  }

  return true;

}


/* ---------------------------------------------------------
   7. 参加者一覧の作成
--------------------------------------------------------- */

function renderParticipantList(trip) {

  const participants = trip.participants;

  if (participants.length === 0) {

    return `
      <p class="muted">
        まだ参加者はいません。
      </p>
    `;

  }

  return participants.map((p, i) => {

    const name =
      typeof p === 'string' ? p : p.name;

    return `
      <div class="participant-row"
        style="
          display:flex;
          align-items:center;
          justify-content:space-between;
          gap:12px;
          padding:12px 0;
          border-bottom:1px solid #eee;
        ">

        <span>
          ${escapeHTML(name)}
        </span>

        <button
          class="btn ghost"
          type="button"
          data-remove-participant="${i}">

          削除

        </button>

      </div>
    `;

  }).join('');

}


/* ---------------------------------------------------------
   8. 招待画面の表示
--------------------------------------------------------- */

function renderInviteTab(trip) {

  ensureInviteData(trip);

  const joinToken = getJoinToken();

  /* ---------------------------------------
     招待URLからアクセスした場合
  --------------------------------------- */

  if (joinToken) {

    const valid = isInviteValid(
      trip.invite,
      joinToken
    );

    if (!valid) {

      return `
        <div class="card">

          <div class="section-title">
            <h2>招待URLエラー</h2>
          </div>

          <p class="muted">
            招待URLが無効か、有効期限が切れています。
          </p>

          <p class="muted">
            招待URLを発行した人に、
            新しいURLを確認してください。
          </p>

        </div>
      `;

    }

    return `
      <div class="card">

        <div class="section-title">
          <h2>旅行に参加</h2>
        </div>

        <p class="muted">
          参加者名を入力してください。
        </p>

        <form id="join-form">

          <label for="join-name">
            参加者名
          </label>

          <input
            id="join-name"
            type="text"
            maxlength="30"
            placeholder="例：山田太郎"
            required
          >

          <div class="btn-row">

            <button
              class="btn accent"
              type="submit">

              旅行に参加する

            </button>

          </div>

        </form>

      </div>
    `;

  }


  /* ---------------------------------------
     通常の招待・参加者管理画面
  --------------------------------------- */

  const invite = trip.invite;

  return `

    <!-- 招待URL -->

    <div class="card">

      <div class="section-title">
        <h2>招待</h2>
      </div>

      ${
        invite
        ? `

          <p class="muted">
            発行済みの招待URL
          </p>

          <div
            class="invite-box"
            id="invite-url"
            style="overflow-wrap:anywhere;">

            ${escapeHTML(invite.url)}

          </div>

          <p class="muted">

            有効期限：
            ${escapeHTML(invite.expiry)}

            <br>

            利用回数：
            残り ${Number(invite.remaining)} 回

          </p>

          <div class="btn-row">

            <button
              class="btn secondary"
              id="btn-copy-invite"
              type="button">

              コピー

            </button>

            <button
              class="btn ghost"
              id="btn-reissue-invite"
              type="button">

              URLを再発行

            </button>

          </div>

        `
        : `

          <p class="muted">
            招待URLを発行して、
            旅行の参加者に共有しましょう。
          </p>

          <div class="btn-row">

            <button
              class="btn accent"
              id="btn-issue-invite"
              type="button">

              URL発行

            </button>

          </div>

        `
      }

    </div>


    <!-- 参加者管理 -->

    <div class="card">

      <div class="section-title">
        <h2>参加者管理</h2>
      </div>

      <p class="muted">
        参加者を追加して、
        旅行に参加するメンバーを管理します。
      </p>

      <form id="participant-form">

        <label for="participant-name">
          参加者名
        </label>

        <div class="btn-row">

          <input
            id="participant-name"
            type="text"
            maxlength="30"
            placeholder="名前を入力"
            required
          >

          <button
            class="btn accent"
            type="submit">

            追加

          </button>

        </div>

      </form>

      <h3>
        参加者一覧
        （${trip.participants.length}人）
      </h3>

      <div id="participant-list">

        ${renderParticipantList(trip)}

      </div>

    </div>

  `;

}


/* ---------------------------------------------------------
   9. イベント処理
--------------------------------------------------------- */

function bindInviteTab(trip) {

  ensureInviteData(trip);

  const joinToken = getJoinToken();


  /* ---------------------------------------
     招待URLから参加する処理
  --------------------------------------- */

  const joinForm =
    document.getElementById('join-form');

  if (joinForm) {

    joinForm.onsubmit = function(e) {

      e.preventDefault();

      const input =
        document.getElementById('join-name');

      const name = input.value.trim();

      if (!name) {

        showToast('名前を入力してください');
        return;

      }

      // 招待URLの再確認
      if (!isInviteValid(trip.invite, joinToken)) {

        showToast('招待URLが無効です');
        return;

      }

      // 同じ名前の重複確認
      const exists = trip.participants.some(p => {

        const participantName =
          typeof p === 'string' ? p : p.name;

        return participantName === name;

      });

      if (exists) {

        showToast(
          '同じ名前の参加者がすでにいます'
        );

        return;

      }

      // 参加者を追加
      trip.participants.push({

        id: createParticipantId(),

        name: name,

        joinedAt: new Date().toISOString()

      });

      // 利用回数を減らす
      trip.invite.remaining--;

      // URLのパラメータを削除
      window.history.replaceState(
        {},
        '',
        window.location.pathname
      );

      // 画面を更新
      rerenderPage();

      showToast('旅行に参加しました');

    };

    return;

  }


  /* ---------------------------------------
     招待URLを発行する
  --------------------------------------- */

  const issueBtn =
    document.getElementById('btn-issue-invite');

  if (issueBtn) {

    issueBtn.onclick = function() {

      const token = makeInviteToken();

      const expiry = new Date(
        Date.now() + 7 * 24 * 60 * 60 * 1000
      )
      .toISOString()
      .slice(0, 10);

      // 現在開いているページのURLを利用
      const inviteURL = new URL(
        window.location.href
      );

      inviteURL.searchParams.set(
        'join',
        token
      );

      // 招待データを保存
      trip.invite = {

        token: token,

        url: inviteURL.href,

        expiry: expiry,

        remaining: 5

      };

      rerenderPage();

      showToast('招待URLを発行しました');

    };

  }


  /* ---------------------------------------
     招待URLを再発行する
  --------------------------------------- */

  const reissueBtn =
    document.getElementById('btn-reissue-invite');

  if (reissueBtn) {

    reissueBtn.onclick = function() {

      if (!confirm(
        '古い招待URLを無効にして再発行しますか？'
      )) {

        return;

      }

      trip.invite = null;

      rerenderPage();

      showToast(
        '古い招待URLを無効にしました。新しいURLを発行してください。'
      );

    };

  }


  /* ---------------------------------------
     招待URLをコピーする
  --------------------------------------- */

  const copyBtn =
    document.getElementById('btn-copy-invite');

  if (copyBtn) {

    copyBtn.onclick = async function() {

      const url = trip.invite.url;

      try {

        await navigator.clipboard.writeText(url);

        showToast('URLをコピーしました');

      } catch (error) {

        // コピー機能が使えない場合
        const textarea =
          document.createElement('textarea');

        textarea.value = url;

        textarea.style.position = 'fixed';
        textarea.style.opacity = '0';

        document.body.appendChild(textarea);

        textarea.select();

        const copied =
          document.execCommand('copy');

        textarea.remove();

        if (copied) {

          showToast('URLをコピーしました');

        } else {

          showToast(
            'コピーできません。URLを手動でコピーしてください。'
          );

        }

      }

    };

  }


  /* ---------------------------------------
     参加者を追加する
  --------------------------------------- */

  const participantForm =
    document.getElementById('participant-form');

  if (participantForm) {

    participantForm.onsubmit = function(e) {

      e.preventDefault();

      const input =
        document.getElementById('participant-name');

      const name = input.value.trim();

      if (!name) {

        showToast('名前を入力してください');
        return;

      }

      // 重複確認
      const exists = trip.participants.some(p => {

        const participantName =
          typeof p === 'string' ? p : p.name;

        return participantName === name;

      });

      if (exists) {

        showToast(
          '同じ名前の参加者がすでにいます'
        );

        return;

      }

      trip.participants.push({

        id: createParticipantId(),

        name: name,

        joinedAt: new Date().toISOString()

      });

      rerenderPage();

      showToast('参加者を追加しました');

    };

  }


  /* ---------------------------------------
     参加者を削除する
  --------------------------------------- */

  document
    .querySelectorAll('[data-remove-participant]')
    .forEach(btn => {

      btn.onclick = function() {

        const idx = Number(
          btn.dataset.removeParticipant
        );

        if (
          !Number.isInteger(idx) ||
          idx < 0 ||
          idx >= trip.participants.length
        ) {

          return;

        }

        if (!confirm(
          'この参加者を削除しますか？'
        )) {

          return;

        }

        trip.participants.splice(idx, 1);

        rerenderPage();

        showToast('参加者を削除しました');

      };

    });

}


/* ---------------------------------------------------------
   10. ページの初期化
--------------------------------------------------------- */

initTripPage(
  'invite.html',
  renderInviteTab,
  bindInviteTab
);

</script>

</body>
</html>
