<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>招待｜旅費メモ</title>

  <link rel="stylesheet" href="styles.css">

  <style>
    .invite-section {
      background: #fff;
      border-radius: 12px;
      padding: 20px;
      margin: 18px 0;
      border: 1px solid #e5e5e5;
    }

    .invite-section h3 {
      margin-top: 0;
    }

    .invite-field {
      margin: 15px 0;
    }

    .invite-field label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
    }

    .invite-field input,
    .invite-field select {
      width: 100%;
      padding: 11px;
      border: 1px solid #ccc;
      border-radius: 7px;
      box-sizing: border-box;
    }

    .invite-url {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    .invite-url input {
      flex: 1;
      min-width: 0;
      padding: 10px;
    }

    .invite-url button {
      white-space: nowrap;
    }

    .invite-note {
      color: #777;
      font-size: 13px;
      line-height: 1.6;
    }

    .invite-result {
      background: #f5f8f5;
      padding: 15px;
      border-radius: 8px;
      margin-top: 15px;
    }

    .invite-error {
      color: #c0392b;
      margin-top: 10px;
    }

    .join-box {
      max-width: 480px;
      margin: 35px auto;
      padding: 22px;
      background: white;
      border: 1px solid #ddd;
      border-radius: 12px;
    }

    .join-box input {
      width: 100%;
      padding: 12px;
      margin: 12px 0;
      box-sizing: border-box;
    }
  </style>
</head>

<body>

<div id="app"></div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script src="common.js"></script>

<script>
/*
=================================================
招待画面
=================================================
*/

// 招待URL参加処理
async function handleInviteJoin() {

  const params = new URLSearchParams(location.search);
  const token = params.get('join');

  if (!token) return false;

  const app = document.getElementById('app');

  app.innerHTML = `
    <main class="join-box">
      <h2>旅行への参加</h2>
      <p>参加する名前を入力してください。</p>

      <form id="join-form">
        <input
          type="text"
          id="join-name"
          maxlength="30"
          placeholder="名前を入力"
          required
        >

        <button class="btn accent" type="submit">
          旅行に参加する
        </button>

        <p id="join-error" class="invite-error"></p>
      </form>
    </main>
  `;

  document.getElementById('join-form').addEventListener(
    'submit',
    async (event) => {

      event.preventDefault();

      const name =
        document.getElementById('join-name').value.trim();

      const errorArea =
        document.getElementById('join-error');

      if (!name) {
        errorArea.textContent = '名前を入力してください。';
        return;
      }

      try {

        const user = await ensureSupabaseUser();

        const { data, error } =
          await supabaseClient.rpc(
            'join_trip_by_invite',
            {
              p_token: token,
              p_name: name
            }
          );

        if (error) throw error;

        // 参加完了後に旅行画面へ移動
        location.href =
          'members.html?trip=' + encodeURIComponent(data);

      } catch (error) {

        console.error(error);

        errorArea.textContent =
          error.message || '参加できませんでした。';

      }

    }
  );

  return true;
}


// 招待URL発行画面
function renderInviteTab(trip) {

  const isCurrentOwner =
    trip.members.some(m =>
      m.id === state.currentUserId && m.owner
    );

  if (!isCurrentOwner) {
    return `
      <section class="invite-section">
        <h3>招待</h3>
        <p>招待URLの発行は旅行の管理者のみ行えます。</p>
      </section>
    `;
  }

  return `
    <section class="invite-section">

      <h3>招待URLの発行</h3>

      <p>
        URLを友達に共有すると、
        スマートフォンやパソコンから参加できます。
      </p>

      <div class="invite-field">
        <label for="invite-expire">有効期限</label>

        <select id="invite-expire">
          <option value="1">1日</option>
          <option value="3" selected>3日</option>
          <option value="7">7日</option>
          <option value="30">30日</option>
        </select>
      </div>

      <div class="invite-field">
        <label for="invite-count">招待可能人数</label>

        <select id="invite-count">
          <option value="1">1人</option>
          <option value="3">3人</option>
          <option value="5" selected>5人</option>
          <option value="10">10人</option>
          <option value="20">20人</option>
        </select>
      </div>

      <button class="btn accent" id="create-invite">
        招待URLを発行する
      </button>

      <div id="invite-result"></div>

      <p class="invite-note">
        ※招待URLを知っている人は参加できるため、
        信頼できる相手にのみ共有してください。
      </p>

    </section>
  `;
}


// 招待URLを発行
async function createInviteUrl(trip) {

  const resultArea =
    document.getElementById('invite-result');

  const expireDays =
    Number(document.getElementById('invite-expire').value);

  const count =
    Number(document.getElementById('invite-count').value);

  resultArea.textContent = '発行しています...';

  try {

    const user = await ensureSupabaseUser();

    // 暗号学的に安全なランダムトークン
    const bytes = new Uint8Array(32);
    crypto.getRandomValues(bytes);

    const token = Array.from(bytes)
      .map(b => b.toString(16).padStart(2, '0'))
      .join('');

    // SHA-256でハッシュ化して保存する
    const digest = await crypto.subtle.digest(
      'SHA-256',
      new TextEncoder().encode(token)
    );

    const tokenHash = Array.from(
      new Uint8Array(digest)
    )
      .map(b => b.toString(16).padStart(2, '0'))
      .join('');

    const expiresAt = new Date(
      Date.now() + expireDays * 24 * 60 * 60 * 1000
    ).toISOString();

    const { error } = await supabaseClient
      .from('trip_invites')
      .insert({
        trip_id: trip.id,
        token_hash: tokenHash,
        expires_at: expiresAt,
        remaining: count,
        created_by: user.id
      });

    if (error) throw error;

    const url = new URL(
      'invite.html',
      location.href
    );

    url.searchParams.set('trip', trip.id);
    url.searchParams.set('join', token);

    resultArea.innerHTML = `
      <div class="invite-result">

        <strong>招待URLを発行しました。</strong>

        <div class="invite-url">
          <input
            type="text"
            id="generated-url"
            readonly
            value="${escapeHtml(url.href)}"
          >

          <button
            class="btn secondary"
            id="copy-invite"
            type="button"
          >
            コピー
          </button>
        </div>

        <p class="invite-note">
          有効期限：${expireDays}日<br>
          招待可能人数：${count}人
        </p>

      </div>
    `;

    document.getElementById('copy-invite')
      .addEventListener('click', async () => {

        await navigator.clipboard.writeText(url.href);

        showToast('招待URLをコピーしました');

      });

  } catch (error) {

    console.error(error);

    resultArea.innerHTML = `
      <p class="invite-error">
        招待URLを発行できませんでした。
        ${escapeHtml(error.message)}
      </p>
    `;

  }
}


// ボタン設定
function bindInviteTab(trip) {

  const button =
    document.getElementById('create-invite');

  if (!button) return;

  button.addEventListener('click', () => {
    createInviteUrl(trip);
  });
}


// ページ初期化
(async function() {

  // 招待URLからの参加なら、通常ページ初期化より先に処理する
  const isJoining = await handleInviteJoin();

  if (isJoining) return;

  await initTripPage(
    'invite.html',
    renderInviteTab,
    bindInviteTab
  );

})();
</script>

</body>
</html>
