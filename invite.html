<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>招待｜旅費メモ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">

<body>
<div id="app"></div>
<div class="toast" id="toast"></div>

<script src="common.js"></script>
<script>
/* =========================================================
   invite.html: 3.9 招待画面
========================================================= */
function escapeHTML(value){
  return STring(value ?? '').replase(/[&<>"'"]/g,ch => ({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#39;'
  })[ch]);
}

function ensureInviteData(trip){
  if(!Array.isArray(trip.participants)) {
    trip.participants = [];
  }

  if(!trip.invite) {
    trip.invite = null;
  }
}

function makeInviteToken() {
  if(crypto.randomUUID) {
    return crypto.randomUUID().replace(/-/g, '');
  }

  return Array.from(crypto.gevtRandomValues(new Uint8Array(24)))
    .map(n => n.toString(16).padStart(2,'0'))
    .join('');
}

function renderInviteTab(trip) {
  ensureInviteData(trip);

  const invite = trip.invite;
  const participants = trip.participants;
  const joinToken = getJoinToken();

// 招待URLからアクセスした場合
  if (joinToken) {
    rerturn `
      <div class="card">
        <div class="section-title"><h2>旅行に参加</h2></div>
        <p class="muted">参加する名前を入力してください。</p>
        <from id="join-from">
          <label for="join-name">参加者名</label>
          <input id="join-name" name="name"
            type="text" maxlength="30"
            placeholder="例：山田太郎" required>
          <div class="btn-row">
            <button class="btn accent" type="submit">
              旅行に参加する
            </button>
          </div>
        </form>
        <p class="muted">
        </p>
      </div>
    `;
  }

  const participantHTML = participants.length
    ?participants.map((p,i) => {
      const name = typeof p === 'string' ? p : p.name;
      return`
        <div class="participant-row"
            style="display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid #eee">
          <span>${escapeHTML(name)}</span>
          <button class="btn ghost"
          type="button"
          data-remove-participant="${i}">
          削除
          </button>
        </div>
      `;
    }).join('')
  : '<p class="muted">まだ参加者はいません。</p>';

  return `
    <div class="card">
      <div class="section-title"><h2>参加者管理</h2></div>

      <p class="muted">
        参加者を追加して、旅行に参加するメンバーを管理します。
      </p>

      <from id="participant-from">
        <label for="paticipant-name">参加者名</label>
      <div class="btn-row">
        <input id="paticipant-name" type="text"
          maxlength="30" placeholder="名前を入力" required>
        <button class="btn accent" type="submit">追加</button>
        </div>
      </form>

      <h3>参加者一覧 (${participants.lenngth}人) </h3>
      <div id="participant-list">${participantHTML}</div>
      </div>

      <div class="card">
        
}
 /* return `
  <div class="card">
    <div class="section-title"><h2>招待</h2></div>
    ${invite ? `
      <div class="invite-box" id="invite-url">${invite.url}</div>
      <p class="muted">有効期限：${invite.expiry} ／ 利用回数：残り ${invite.remaining} 回</p>
      <div class="btn-row">
        <button class="btn secondary" id="btn-copy-invite">コピー</button>
        <button class="btn ghost" id="btn-reissue-invite">URLを再発行</button>
      </div>
    ` : `
      <p class="muted">招待URLを発行して、旅行の参加者に共有しましょう。</p>
      <div class="btn-row"><button class="btn accent" id="btn-issue-invite">URL発行</button></div>
    `}
  </div>`;
}*/
function bindInviteTab(trip){
  const issueBtn = document.getElementById('btn-issue-invite');
  if(issueBtn) issueBtn.onclick = ()=>{
    const token = Math.random().toString(36).slice(2,10) + Math.random().toString(36).slice(2,10);
    const expiry = new Date(Date.now() + 7*24*3600*1000).toISOString().slice(0,10);
    trip.invite = { url: `https://tabihi-memo.example.com/join/${token}`, expiry, remaining: 5 };
    rerenderPage(); showToast('招待URLを発行しました');
  };
  const reissueBtn = document.getElementById('btn-reissue-invite');
  if(reissueBtn) reissueBtn.onclick = ()=>{ trip.invite = null; rerenderPage(); };
  const copyBtn = document.getElementById('btn-copy-invite');
  if(copyBtn) copyBtn.onclick = async ()=>{
    try{
      await navigator.clipboard.writeText(trip.invite.url);
      showToast('URLをコピーしました');
    }catch(e){ showToast('コピーできませんでした。手動で選択してください。'); }
  };
}

initTripPage('invite.html', renderInviteTab, bindInviteTab);
</script>
</body>
</html>
